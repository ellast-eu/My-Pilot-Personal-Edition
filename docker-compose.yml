# Démarrage : cp .env.example .env (puis compléter) ; docker compose up -d --build
# Réplication distante : docker compose --profile replication up -d  (voir docs/SAUVEGARDES.md)
# HTTPS public avec Caddy : docker compose --profile caddy up -d  (voir README, « Accès à distance »)
name: my-pilot-personal-edition

services:
  app:
    build:
      context: .
      args:
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-true}
    image: my-pilot-personal-edition:${PILOT_VERSION:-latest}
    restart: unless-stopped
    ports:
      # Lié à 127.0.0.1 : exposer via un proxy HTTPS ou un VPN (voir README), jamais en clair sur Internet.
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      APP_USER: ${APP_USER:-pilot}
      APP_PASSWORD: ${APP_PASSWORD:-}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      CLAUDE_BRIDGE: ${CLAUDE_BRIDGE:-on}
      CLAUDE_TIMEOUT: ${CLAUDE_TIMEOUT:-180}
      SYNC_TOKEN: ${SYNC_TOKEN:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      SNAPSHOT_HOURS: ${SNAPSHOT_HOURS:-24}
      KEEP_SNAPSHOTS: ${KEEP_SNAPSHOTS:-30}
      REVISION_INTERVAL: ${REVISION_INTERVAL:-300}
      KEEP_REVISIONS: ${KEEP_REVISIONS:-300}
    volumes:
      - pilot-data:/data
      - claude-config:/home/node/.claude

  # Réplication continue de la base vers un serveur distant (S3 compatible ou SFTP).
  litestream:
    image: litestream/litestream:0.5.14
    profiles: ["replication"]
    restart: unless-stopped
    depends_on: [app]
    command: replicate
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:-}
      LITESTREAM_PATH: ${LITESTREAM_PATH:-my-pilot-personal-edition}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      SFTP_HOST: ${SFTP_HOST:-}
      SFTP_USER: ${SFTP_USER:-}
      SFTP_PATH: ${SFTP_PATH:-}
      SFTP_HOST_KEY: ${SFTP_HOST_KEY:-}
    volumes:
      - pilot-data:/data
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
      - ./deploy/keys:/keys:ro

  # HTTPS public (Let's Encrypt) : nécessite un nom de domaine pointant vers ce serveur, ports 80 et 443 ouverts.
  caddy:
    image: caddy:2.10
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PILOT_DOMAIN: ${PILOT_DOMAIN:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pilot-data:
  claude-config:
  caddy-data:
  caddy-config:
