function datesActivite(c,notesPar){
  var l=[];
  if(dateValide(c.date)) l.push(c.date);
  if(dateValide(c.date_action)) l.push(c.date_action);
  /* archiver un dossier est un acte de gestion, date : un dossier solde en septembre
     sort du reporting, donc sa derniere action reste anterieure. Sans cela il echappe
     a la periode ou il a justement ete clos. */
  if(dateValide(c.archive)) l.push(c.archive);
  (notesPar[c.id]||[]).forEach(function(d){ l.push(d) });
  return l;
}
function notesParChantier(){
  var m={};
  (D.notes||[]).forEach(function(n){
    if(!n.chantier_id || !dateValide(n.date)) return;
    (m[n.chantier_id]||(m[n.chantier_id]=[])).push(n.date);
  });
  return m;
}
function estActePrevention(c){
  var v=[c.type,c.etat_affaire].join(" \u00b7 ");
  var l=D.parametres.actes_prevention||[];
  var ok=false;
  if(l.length){
    l.forEach(function(x){ if(x && v.indexOf(x)>=0) ok=true });
    return ok;
  }
  var t=sansAccent(v).toLowerCase();
  MOTS_PREVENTION.forEach(function(m){ if(t.indexOf(sansAccent(m).toLowerCase())>=0) ok=true });
  return ok;
}
function statsPeriode(a,b){
  var o={},npc=notesParChantier();
  o.dateRef={};                       /* date retenue pour situer l'activite dans le temps */
  o.acts=D.chantiers.filter(function(c){
    var dd=datesActivite(c,npc).filter(function(d){ return dansInt(d,a,b) });
    if(!dd.length) return false;
    dd.sort();
    o.dateRef[c.id]=dd[dd.length-1];  /* la plus recente : c'est la trace la plus parlante */
    return true;
  });
  o.parDate=0; o.parAction=0; o.parNote=0; o.parArch=0;
  o.acts.forEach(function(c){
    if(dansInt(c.date,a,b)) o.parDate++;
    else if(dansInt(c.archive,a,b)) o.parArch++;
    else if(dansInt(c.date_action,a,b)) o.parAction++;
    else o.parNote++;
  });
  o.notes=(D.notes||[]).filter(function(n){ return dansInt(n.date,a,b) });
  o.apps=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature!=="verif" });
  o.verifs=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature==="verif" });
  o.dts=(D.dtdict||[]).filter(function(c){ return dansInt(c.date,a,b) });
  o.vigs=(D.vigilances||[]).filter(function(v){ return dansInt(v.date,a,b) });
  o.ouvres=joursOuvresEntre(a,b);
  o.abs=(D.parametres.absences||[]).filter(function(x){ return dansInt(x,a,b) }).length;
  o.clos=o.acts.filter(estAbouti).length;
  o.closStatut=o.acts.filter(estClos).length;
  o.closArch=o.acts.filter(function(c){ return !estClos(c) && c.archive_issue==="traite" }).length;
  o.sortis=o.acts.filter(function(c){ return c.archive_issue==="sorti" }).length;
  o.nonQualif=o.acts.filter(function(c){ return c.archive && !c.archive_issue }).length;
  o.tauxClos=o.acts.length?Math.round(o.clos*100/o.acts.length):0;
  o.parCat=compterPar(o.acts,function(c){ var K=catParCle(c.categorie||"chantier"); return K?K.lib:"" });
  o.parSt=compterPar(o.acts,function(c){ return libStatut(c.statut) });
  /* l'avancement n'a de sens qu'a l'interieur d'une categorie : les jeux de statuts different */
  o.avanc=[];
  categories().forEach(function(K){

    /* ce que la categorie porte en dehors de la periode : sans ce reperage, un compte
       faible se lit comme une anomalie alors qu'il ne dit que la borne de dates. */
    var tot=D.chantiers.filter(function(c){ return (c.categorie||"chantier")===K.cle }).length;
    if(!sl.length){
      o.avanc.push({lib:K.plur||K.lib,n:0,clos:0,st:[],vide:true,hors:tot});
      return;
    }
    o.avanc.push({lib:K.plur||K.lib,n:sl.length,hors:tot-sl.length,clos:sl.filter(estAbouti).length,
      st:compterPar(sl,function(c){ return libStatut(c.statut) })});
  });
  /* une categorie qui porte des activites mais ne cloture jamais : reglage probablement absent */
  o.sansCloture=o.avanc.filter(function(x){ return x.n>=5 && x.clos===0 }).map(function(x){ return x.lib });
  o.videsPeriode=o.avanc.filter(function(x){ return x.hors>0 })
    .map(function(x){ return x.lib+" ("+x.hors+")" });
  o.parType=compterPar(o.acts,function(c){ return c.type });
  o.parMotif=compterPar(o.apps,function(x){ return x.motif });
  o.parTn=compterPar(o.notes,function(n){ return n.type });
  o.parCom=compterPar(o.acts,function(c){ return c.commune });
  /* prevention : ce que le poste produit, par opposition au volume traite */
  var prevActs=o.acts.filter(estActePrevention);
  var convs=[],anims=[];
  o.acts.forEach(function(c){
    var K=catParCle(c.categorie||"chantier");
    if(!K) return;
    if(K.statuts==="statuts_rdv" && estAbouti(c)){
      if(K.champs && K.champs.some && K.champs.some(function(f){ return f.cle==="participants" })) anims.push(c);
      else convs.push(c);
    }
  });
  var ents={},pub=0;
  convs.concat(anims).forEach(function(c){ if(c.tiers) ents[cleOrg(c.tiers)]=1 });
  anims.forEach(function(c){ pub+=(+c.participants||0) });
  o.prev={
    actes:compterPar(prevActs,function(c){ return c.type||c.etat_affaire||"Non typé" }),
    total:prevActs.length,
    conv:convs.length, anim:anims.length,
    ents:Object.keys(ents).length, publics:pub,
    regle:(D.parametres.actes_prevention||[]).length?"liste":"auto"
  };
  o.temps=[]; o.totTemps=0;
  (D.parametres.rubriques||[]).forEach(function(r){
    var m=0;
    o.notes.forEach(function(n){ if(n.rubrique_id===r.id) m+=+n.duree||0 });
    if(r.auto==="dtdict") o.dts.forEach(function(c){ m+=minutesSession(c) });
    if(r.auto==="appels") o.apps.forEach(function(x){ m+=+x.duree||0 });
    if(m>0){ o.temps.push([r.nom,m]); o.totTemps+=m }
  });
  var mAct=0;
  o.acts.forEach(function(c){
    if(!estClos(c)) return;
    var d=+c.duree||0,nn=0;
    o.notes.forEach(function(n){ if(n.chantier_id===c.id) nn+=+n.duree||0 });
    mAct+=Math.max(d,nn);
  });
  if(mAct>0){ o.temps.push(["Activités du planning",mAct]); o.totTemps+=mAct }
  o.temps.sort(function(x,y){ return y[1]-x[1] });
  var tr=0,se=0,mx=0;
  o.dts.forEach(function(c){ tr+=+c.traites||0; se+=minutesSession(c); if((+c.traites||0)>mx) mx=+c.traites||0 });
  o.dt={jours:o.dts.length,traites:tr,temps:se,max:mx,cadence:se>0?Math.round(tr/(se/60)*10)/10:0};
  var jp={},dur=0;
  o.apps.forEach(function(x){ jp[x.date]=1; dur+=+x.duree||0 });
  o.perm={jours:Object.keys(jp).length,appels:o.apps.length,temps:dur,
    moy:o.apps.length?Math.round(dur/o.apps.length):0,verifs:o.verifs.length};
  o.vig={};
  ["critique","attention","info"].forEach(function(n){
    o.vig[n]={total:o.vigs.filter(function(v){return (v.niveau||"info")===n}).length,
              leves:o.vigs.filter(function(v){return (v.niveau||"info")===n && v.clos}).length};
  });
  var su=o.notes.filter(function(n){ return n.suite });
  o.suites={total:su.length,soldees:su.filter(function(n){return n.suite.fait}).length,
    echues:su.filter(function(n){ return !n.suite.fait && n.suite.echeance && n.suite.echeance<auj() }).length};
  var og={};

  o.orgs=Object.keys(og).length;

  o.mois=[];
  var d1=pIso(a),d2=pIso(b),g=0;

    o.mois.push({cle:pre,lib:["J","F","M","A","M","J","J","A","S","O","N","D"][d1.getMonth()],
      n:o.acts.filter(function(c){ return String(o.dateRef[c.id]||"").slice(0,7)===pre }).length,
      f:o.acts.filter(function(c){ return estAbouti(c) && String(o.dateRef[c.id]||"").slice(0,7)===pre }).length});
    d1.setMonth(d1.getMonth()+1);
  }
  return o;
}
function periodeAvant(a,b){
  var j=Math.round((pIso(b)-pIso(a))/86400000)+1;
  var f=pIso(a); f.setDate(f.getDate()-1);
  var d=pIso(a); d.setDate(d.getDate()-j);
  return [iso(d),iso(f)];
}
function ecart(n,p){

  var pc=Math.round((n-p)*100/p);

  if(pc<0) return '<span class="e">\u25bc \u2212 '+Math.abs(pc)+' % \u00b7 '+p+'</span>';

function rpCourbe(mois){
  if(mois.length<2) return "";
  var mx=1,tot=0; mois.forEach(function(m){ if(m.n>mx) mx=m.n; tot+=m.n });
  if(!tot) return '<p class="rp-i">Aucune activité datée sur la période.</p>';
  var x0=42,larg=(690-x0)/mois.length,haut=100,b="",l="",pts=[];
  mois.forEach(function(m,i){
    var h=m.n/mx*haut,x=x0+i*larg,y=112-h;
    b+='<rect x="'+(x+larg*0.18).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(larg*0.64).toFixed(1)
      +'" height="'+h.toFixed(1)+'" fill="#6E746F"/>';
    if(m.n) b+='<text x="'+(x+larg/2).toFixed(1)+'" y="'+(y-3).toFixed(1)
      +'" text-anchor="middle" font-family="Consolas,monospace" font-size="8.5" fill="#4A514C">'+m.n+'</text>';
    l+='<text x="'+(x+larg/2).toFixed(1)+'" y="124" text-anchor="middle">'+m.lib+'</text>';
    var so=0,nb=0,k;
    for(k=Math.max(0,i-2);k<=i;k++){ so+=mois[k].n; nb++ }
    pts.push((x+larg/2).toFixed(1)+","+(112-(so/nb)/mx*haut).toFixed(1));
  });
  return '<svg viewBox="0 0 700 132" style="width:100%;height:auto">'
    +'<line x1="34" y1="6" x2="34" y2="112" stroke="#C8CCC7"/>'
    +'<line x1="34" y1="112" x2="694" y2="112" stroke="#191C1B"/>'
    +'<text x="28" y="12" text-anchor="end" font-family="Consolas,monospace" font-size="9" fill="#878D88">'+mx+'</text>'
    +'<text x="28" y="115" text-anchor="end" font-family="Consolas,monospace" font-size="9" fill="#878D88">0</text>'
    +b+'<polyline fill="none" stroke="#191C1B" stroke-width="1.6" stroke-dasharray="4 3" points="'+pts.join(" ")+'"/>'
    +'<g font-family="Consolas,monospace" font-size="8.5" fill="#4A514C">'+l+'</g></svg>';
}

  var sauveLienQ=$("#lienQ")?$("#lienQ").value:null;
  var sauveCtQ=$("#ctq")?$("#ctq").value:null;

  else if(vueActive==="chantiers") m.innerHTML=vueChantiers();
  else if(vueActive==="journal") m.innerHTML=vueJournal();

  if(sauveCtQ && $("#ctq")){ $("#ctq").value=sauveCtQ; }

  $("#version").textContent="v"+APP_VERSION;
  var nm=String((D.parametres&&D.parametres.nom_app)||NOM_DEFAUT);
  $("#marque").innerHTML=esc(nm).replace(/\s+/g,'<span>\u00b7</span>');

  if(!alertesEnCours().length) document.title=titreBase;
  var bp=$("#btnPause"); if(bp) bp.style.display=fichierCharge?"":"none";
  majStyleCats();
  majCompteurPause();
  $("#dateJour").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});

  });

/* rendre() reconstruit la vue : sans cela le champ de recherche perd le focus a chaque
   caractere. Tout champ de filtre qui declenche un rendu doit passer par ici. */
function rendreEtRendreLeFocus(id){
  var e=$("#"+id),pos=e?e.selectionStart:null;
  rendre();
  var n=$("#"+id);
  if(!n) return;
  n.focus();
  try{ if(pos!==null) n.setSelectionRange(pos,pos) }catch(x){}   /* type=search : pas partout */
}

  if(t.id==="gestFiltre"){ D.parametres.gestionnaire=t.value.trim(); modifie(); toast("Filtre mis à jour"); return }
  if(t.id==="sugOn"){ M.reglages.suggerer=t.checked; modifieMenu(); return }
  if(t.id==="sugClo"){ M.reglages.sur_cloture=t.checked; modifieMenu(); return }
  if(t.id==="sugEpr"){ M.reglages.sur_eprouvante=t.checked; modifieMenu(); return }
  if(t.id==="sugDur"){ M.reglages.filtrer_duree=t.checked; modifieMenu(); return }
  if(t.id==="sugJour"){ M.reglages.rappel_jour=Math.max(0,+t.value||0); armerRappelJour(); modifieMenu(); return }
  if(t.tagName==="SELECT" && t.dataset.liste){
    var cle=t.dataset.liste, l=D.parametres[cle]||(D.parametres[cle]=[]);
    if(t.value==="__add__"){
      var prec=t.dataset.prec||l[0]||"";
      t.value=prec;                       /* jamais « __add__ » enregistré pendant la saisie */
      window.persoSaisir("Nouvelle valeur à ajouter à la liste").then(function(v){
        v=(v||"").trim();
        var l2=D.parametres[cle]||(D.parametres[cle]=[]);
        if(v && l2.indexOf(v)===-1){ l2.push(v); modifie(); toast('« '+v+' » ajouté à la liste') }
        var choix=v||prec;
        if(!t.isConnected) return;
        t.innerHTML=selOpts(l2,choix)+'<option value="__add__">＋ Ajouter à la liste…</option>';
        t.value=choix; t.dataset.prec=choix;
      });
    }else t.dataset.prec=t.value;
    return;
  }
  if(t.id==="dtH"||t.id==="dtK"){
    var c=compteurDu(auj(),true);
    c.heures=Math.max(0,+$("#dtH").value||0);
    c.cadence=Math.max(0,+$("#dtK").value||0);
    D.parametres.dtdict={heures:c.heures,cadence:c.cadence};
    modifie(); rendre(); return;
  }
  if(t.id==="autoEnr"){ D.parametres.auto=t.checked; modifie(); rendre(); return }
  if(t.id==="ctorg"){ filtreCt.org=t.value; rendre(); return }
  if(t.id==="ctniv"){ filtreCt.niveau=t.value; rendre(); return }
  if(t.id==="lienCat"){ filtreLienCat=t.value; majSelectLien(); return }
  if(t.id==="fjournal"){ filtreJournal=t.value; rendre(); return }
  if(t.id==="fcat"){ filtreCh.cat=t.value; rendre() }
  else if(t.id==="fstatut"){ filtreCh.statut=t.value; rendre() }
  else if(t.id==="fperiode"){ filtreCh.periode=t.value; rendre() }
  else if(t.id==="farch"){ filtreCh.arch=t.value; rendre() }
  else if(t.dataset && t.dataset.jour!==undefined){
    var j=+t.dataset.jour,l=D.parametres.jours_ouvres||[];
    D.parametres.jours_ouvres = t.checked ? l.concat([j]).sort() : l.filter(function(x){return x!==j});
    modifie();
  }
  else if(t.id==="fichierCt" && t.files && t.files[0]){
    var fct=t.files[0],rct=new FileReader();
    if(tropGros(fct)){ t.value=""; return }
    rct.onload=function(){ importerContactsCSV(rct.result) };
    rct.readAsText(fct,"UTF-8"); t.value=""; return;
  }
  else if(t.id==="fichierConfig" && t.files && t.files[0]){
    var fg=t.files[0],rg=new FileReader();
    if(tropGros(fg)){ t.value=""; return }
    rg.onload=function(){ appliquerConfig(rg.result) };
    rg.readAsText(fg); t.value=""; return;
  }
  else if(t.id==="fichierXlsx" && t.files && t.files[0]){
    importerXlsx(t.files[0]); t.value=""; return;
  }
  else if(t.id==="fichierCarte" && t.files && t.files[0]){
    var fc=t.files[0],rc=new FileReader();
    if(tropGros(fc)){ t.value=""; return }
    rc.onload=function(){ appliquerCarte(rc.result) };
    rc.readAsText(fc); t.value=""; return;
  }
  else if(t.id==="fichierCache" && t.files && t.files[0]){
    var mode=t.dataset.mode||"remplacer";
    var f=t.files[0];
    if(tropGros(f)){ t.value=""; return }
    nomFichier=f.name;
    var r=new FileReader();
    r.onload=function(){ appliquerTexte(r.result,mode) };
    r.readAsText(f);
    t.value=""; t.dataset.mode="remplacer";
  }
});
document.addEventListener("keydown",function(e){
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); enregistrer(false); return }
  if((e.ctrlKey||e.metaKey) && e.key==="Enter" && e.target.id==="noteRapide"){ e.preventDefault(); ajouterNote(); return }
  if(e.key==="Enter" && e.target.id==="ftTxt"){ e.preventDefault(); ajouterDepuisFiche("tache"); return }
  if(e.key==="Enter" && /^(apQui|apObj|apTel|apEnt|apCom)$/.test(e.target.id)){ e.preventDefault(); ajouterAppel(); return }
  if(e.key==="Enter" && e.target.dataset && e.target.dataset.ajout){
    e.preventDefault();
    var b2=document.querySelector('[data-additem="'+e.target.dataset.ajout+'"]');
    if(b2) b2.click();
    return;
  }
  if(e.key==="Enter" && e.target.id==="vigiTxt"){
    e.preventDefault();
    var b=document.querySelector('[data-act="vigi-add"]'); if(b) b.click();
  }
});

/* ================= ecran de demarrage ================= */
var splashFini=false;
function fermerSplash(){
  if(splashFini) return;
  splashFini=true;
  var e=$("#splash");
  if(!e) return;
  e.classList.add("sortie");
  setTimeout(function(){ if(e.parentNode) e.parentNode.removeChild(e) },340);
}
function jouerSplash(){
  var e=$("#splash");
  if(!e) return;
  if(D.parametres.splash===false){ splashFini=true; e.parentNode.removeChild(e); return }
  var nom=String(D.parametres.nom_app||NOM_DEFAUT);
  $("#spLogo").innerHTML=iconeSVG("#191C1B","#D8232A","#FBFBF9");
  var fin=function(){
    $("#spNom").innerHTML=esc(nom).replace(/\s+/g,'<span class="pt">\u00b7</span>');
    $("#spSous").style.opacity="1";
    setTimeout(fermerSplash,420);
  };
  var reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduit){ fin(); return }
  var cible=nom.toUpperCase().split(""),fixe=0,n=$("#spNom");
  var pas=Math.max(34,Math.floor(760/Math.max(cible.length,1)));
  var it=setInterval(function(){
    if(splashFini){ clearInterval(it); return }
    var out="",i;
    for(i=0;i<cible.length;i++){
      if(i<fixe) out += (cible[i]===" ") ? '<span class="pt">\u00b7</span>' : esc(cible[i]);
      else out += '<span class="bit">'+(Math.random()<0.5?"0":"1")+'</span>';
    }
    n.innerHTML=out;
    if(fixe++>cible.length){ clearInterval(it); fin() }
  },pas);
  setTimeout(fermerSplash,3200);          /* filet de securite : jamais bloquant */
  e.addEventListener("click",fermerSplash);
}

window.__pilotInit = (function init(){
  var local=lireLocal();
  D = local ? normaliser(local) : vierge();
  M = D.carte || (D.carte=viergeMenu());
  if(menuVide()){                       /* migration depuis l'ancien stockage separe */
    var src=null;
    try{ var v=localStorage.getItem(CLE_M); if(v) src=JSON.parse(v) }catch(e){}
    if(src && src.sections){
      poserCarte(src);
      if(!menuVide()) setTimeout(function(){
        toast("Carte récupérée et rattachée à vos données : plus rien à ouvrir le matin");
      },900);
    }
  }
  sale=false;
  (D.dtdict||[]).forEach(function(c){          // sessions oubliees d'un jour precedent
    if(c.date===auj() || !c.sessions) return;
    c.sessions.forEach(function(s){
      if(!s.fin){
        var dernier=(c.jalons&&c.jalons.length)?c.jalons[c.jalons.length-1].h:s.debut;
        s.fin = minutes(dernier)>minutes(s.debut) ? dernier : s.debut;
        s.cloture_auto=true;
      }
    });
  });
  rendre();
  armerRappelJour();
  jouerSplash();
  setInterval(function(){ tickCompteur(); tickPermanence(); tickPause(); tickSauvegarde() },10000);
  majTitre();
  if(!localDispo()) setTimeout(function(){
    toast("Sauvegarde automatique indisponible ici : enregistrez votre fichier régulièrement",true);
  },1400);
});
