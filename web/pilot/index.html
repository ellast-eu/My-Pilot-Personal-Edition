<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Pilot Personal Edition</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
<style>
:root{
  --beton:#E6E7E3;
  --beton-2:#D6D8D1;
  --papier:#FBFBF9;
  --encre:#191C1B;
  --encre-2:#5C625E;
  --encre-3:#8B918C;
  --trait:rgba(25,28,27,.16);
  --rouge:#D8232A;
  --jaune:#E8A400;
  --vert:#1F7A4D;
  --ardoise:#2B4C6F;
  --prune:#7A2E4E;
  --sarcelle:#0F6E78;
  --ocre:#8A6320;
  --display:"Bahnschrift","DIN Alternate","Franklin Gothic Medium","Segoe UI",system-ui,sans-serif;
  --corps:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --data:"Consolas","SFMono-Regular","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--beton);
  color:var(--encre);
  font-family:var(--corps);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.dsp{
  font-family:var(--display);
  font-variation-settings:"wght" 600,"wdth" 87.5;
  font-weight:600;
  letter-spacing:.02em;
  margin:0;
}
.mono{font-family:var(--data);font-size:.92em;font-variant-numeric:tabular-nums}

/* ---------- rapport imprimable ---------- */
#impression{display:none}
@media print{
  html,body{background:#fff !important}
  body > *{display:none !important}
  #impression{display:block !important;background:#fff;color:#191C1B;font-family:var(--corps)}
  @page{size:A4 portrait;margin:16mm 18mm 14mm}
  .rp-page{page-break-after:always}
  .rp-page:last-child{page-break-after:auto}
  /* sans cela, Edge et Chrome suppriment tous les aplats a l'impression */
  #impression,#impression *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important}
  #impression h2,.rp-tete{break-inside:avoid;page-break-inside:avoid}
  table.rp-tab tr.nul td{color:#8B918C}
  .rp-flux{break-inside:avoid;page-break-inside:avoid}
  /* un titre ne reste jamais seul en bas de page, son introduction non plus */
  #impression h2,p.rp-i{break-after:avoid;page-break-after:avoid}
  /* les longues listes se coupent entre deux lignes plutot que de sauter en bloc :
     une seule rubrique de trop renvoyait tout le tableau a la page suivante et
     laissait une demi-page blanche. */
  table.rp-rep,table.rp-tab,table.rp-dense,.rp-detail{break-inside:auto;page-break-inside:auto}
  table.rp-rep tr,table.rp-tab tr,table.rp-dense tr{break-inside:avoid;page-break-inside:avoid}
  .rp-cles,.rp-saisie{break-inside:avoid;page-break-inside:avoid}
}
.rp-tete{border-bottom:2px solid var(--rouge);padding-bottom:7px;margin-bottom:5px;display:flex;align-items:flex-end;gap:14px}
.rp-tete .qui{flex:1}
.rp-nom{font-family:var(--display);font-size:17px;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.rp-fonc{font-size:11.5px;color:#4A514C;margin-top:1px}
.rp-per{text-align:right;font-family:var(--data);font-size:10.5px;color:#4A514C;line-height:1.55}
.rp-per b{display:block;font-family:var(--display);font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:#191C1B}
.rp-st{font-family:var(--data);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#878D88;margin-bottom:13px}
#impression h2{font-family:var(--display);font-size:12px;letter-spacing:.11em;text-transform:uppercase;
  margin:15px 0 7px;padding-bottom:3px;border-bottom:1px solid #191C1B;font-weight:700}
#impression p.rp-i{font-size:10.5px;color:#4A514C;margin:0 0 9px;line-height:1.5}
.rp-cles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.rp-cle{border:1px solid #C8CCC7;border-top:3px solid #191C1B;padding:8px 9px 9px}
.rp-cle .v{font-family:var(--display);font-size:24px;line-height:1;font-weight:700}
.rp-cle .l{font-size:9.5px;color:#4A514C;margin-top:4px;line-height:1.3}
.rp-cle .e{font-family:var(--data);font-size:9.5px;margin-top:5px;padding-top:4px;border-top:1px dotted #C8CCC7}
table.rp-rep{width:100%;border-collapse:collapse;font-size:10.5px}
table.rp-rep td{padding:3px 0;vertical-align:middle}
table.rp-rep td.l{width:38%;padding-right:8px}
table.rp-rep td.b{width:44%}
table.rp-rep td.v{width:18%;text-align:right;font-family:var(--data);font-size:10px;white-space:nowrap}
.rp-piste{display:block;height:9px;background:#D8DBD7;position:relative}
.rp-piste i{position:absolute;left:0;top:0;bottom:0;display:block}
.rp-t1{background:#3A403C}.rp-t2{background:#6E746F}.rp-t3{background:#A8ADA8}
.rp-t4{background:repeating-linear-gradient(45deg,#6E746F 0 3px,#D8DBD7 3px 6px)}
.rp-t5{background:repeating-linear-gradient(90deg,#3A403C 0 2px,transparent 2px 5px)}
table.rp-tab{width:100%;border-collapse:collapse;font-size:10.5px}
table.rp-tab tr.nul td{color:#8B918C}
.rp-flux{margin-top:10px;padding-top:8px;border-top:1px solid #191C1B}
.rp-flux-t{font-family:var(--display);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:#5C625E;margin-bottom:5px}
table.rp-tab th{font-family:var(--display);font-size:9px;letter-spacing:.09em;text-transform:uppercase;
  text-align:left;border-bottom:1px solid #191C1B;padding:4px 6px 3px;color:#4A514C}
table.rp-tab td{padding:3.5px 6px;border-bottom:1px solid #C8CCC7}
table.rp-tab td.n{text-align:right;font-family:var(--data);font-size:10px}
table.rp-dense td{padding:2.5px 6px;font-size:10px;line-height:1.35}
table.rp-dense tr.tete td{padding-top:6px}
.rp-duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rp-saisie{border:1px solid #C8CCC7;border-left:3px solid #191C1B;padding:9px 11px;font-size:10.5px;
  line-height:1.55;white-space:pre-wrap;min-height:11mm}
.rp-saisie.vide{color:#878D88;font-style:italic}
.rp-mention{font-family:var(--data);font-size:8.5px;color:#878D88;margin-top:9px;line-height:1.5}

/* ---------- ecran de demarrage ---------- */
.splash{
  position:fixed;inset:0;z-index:200;background:var(--encre);
  display:grid;place-items:center;cursor:pointer;transition:opacity .32s ease-out;
}
.splash.sortie{opacity:0;pointer-events:none}
.sp-in{text-align:center;padding:20px}
.sp-logo{display:block;width:40px;height:40px;margin:0 auto 14px}
.sp-logo svg{display:block;width:100%;height:100%}
.sp-nom{
  font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 75;
  font-size:34px;letter-spacing:.16em;text-transform:uppercase;color:#F2F3F1;white-space:nowrap;min-height:40px;
}
.sp-nom .bit{font-family:var(--data);color:var(--rouge);letter-spacing:.16em}
.sp-nom .pt{color:var(--rouge)}
.sp-sous{
  font-family:var(--data);font-size:11px;letter-spacing:.22em;color:#6F756F;
  text-transform:uppercase;margin-top:9px;opacity:0;transition:opacity .3s;
}
@media(max-width:480px){.sp-nom{font-size:24px;letter-spacing:.12em}}
@media (prefers-reduced-motion:reduce){.splash{transition:none}}

/* ---------- barre d'etat ---------- */
header{
  position:sticky;top:0;z-index:40;
  background:var(--encre);color:#F2F3F1;
  border-bottom:3px solid var(--rouge);
}
.bandeau{display:flex;align-items:center;gap:16px;padding:9px 18px;flex-wrap:wrap}
.logo{width:26px;height:26px;flex:none;display:block;margin-right:-2px}
.logo svg{display:block;width:100%;height:100%}
.marque{font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 75;
  font-size:19px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.marque span{color:var(--rouge)}
.version{
  font-family:var(--data);font-size:11px;color:#8C938E;
  border:1px solid #3A403C;padding:1px 5px;border-radius:2px;margin-left:-8px;letter-spacing:.02em;
}
.jour{font-family:var(--data);font-size:13px;color:#B9BEBA;text-transform:capitalize}
.etat{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12.5px;font-family:var(--data);
  flex-wrap:wrap;justify-content:flex-end;min-width:0}
.pastille{width:9px;height:9px;border-radius:50%;background:var(--vert);flex:none}
.pastille.sale{background:var(--jaune);animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.etat-txt{color:#B9BEBA}
.etat.sale .etat-txt{color:#FFD466}

nav{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
nav button{
  appearance:none;background:transparent;border:0;color:#9AA09B;cursor:pointer;
  font-family:var(--display);font-variation-settings:"wght" 600,"wdth" 87.5;
  font-size:13.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:9px 14px;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap;
}
nav button:hover{color:#F2F3F1}
nav button.bloque{opacity:.35;cursor:not-allowed}
nav button.bloque:hover{color:#9AA09B}
nav button[aria-current="true"]{color:#fff;border-bottom-color:var(--rouge)}

/* ---------- structure ---------- */
main{max-width:1240px;margin:0 auto;padding:20px 18px 80px}
.duo{display:grid;grid-template-columns:1.15fr .85fr;gap:18px;align-items:start}
.duo>*{min-width:0}
.bloc,.bloc-corps,.trace,.piquet,.chantier{min-width:0}
@media(max-width:900px){.duo{grid-template-columns:1fr}}
.bloc{background:var(--papier);border:1px solid var(--trait);border-radius:2px}
.bloc-tete{
  display:flex;align-items:baseline;gap:10px;padding:11px 14px;border-bottom:1px solid var(--trait);
  background:linear-gradient(var(--papier),#F3F3F0);
}
.bloc-tete h2{font-size:14px;letter-spacing:.1em;text-transform:uppercase}
.compte{font-family:var(--data);font-size:12px;color:var(--encre-3);margin-left:auto}
.bloc-corps{padding:14px}
.vide{padding:26px 16px;text-align:center;color:var(--encre-2);font-size:14px}
.vide b{display:block;font-family:var(--display);font-size:15px;color:var(--encre);margin-bottom:4px}

/* ---------- signature : trace de piquetage ---------- */
/* geometrie : heure 0>44 | croix 52>67 (axe 59.5) | carte a partir de 79 */
.trace{position:relative;padding-left:79px}
.trace:before{
  content:"";position:absolute;left:59px;top:4px;bottom:4px;width:1px;
  background:repeating-linear-gradient(var(--encre-3) 0 5px,transparent 5px 10px);
}
.piquet{position:relative;margin-bottom:12px}
.piquet:last-child{margin-bottom:0}
.piquet .h{
  position:absolute;left:-79px;top:10px;width:44px;text-align:right;
  font-family:var(--data);font-size:13px;line-height:1.1;color:var(--encre-2);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.piquet .croix{
  position:absolute;left:-27px;top:11px;width:15px;height:15px;
  border:1.5px solid var(--encre);background:var(--papier);
  display:grid;place-items:center;font-size:10px;line-height:1;color:var(--encre);
}
@media(max-width:480px){
  .trace{padding-left:66px}
  .trace:before{left:49px}
  .piquet .h{left:-66px;width:34px;font-size:12px}
  .piquet .croix{left:-24px}
}
.piquet[data-statut="realise"] .croix,.piquet[data-statut="termine"] .croix{background:var(--vert);border-color:var(--vert);color:#fff}
.piquet[data-statut="annule"] .croix,.piquet[data-statut="reporte"] .croix{border-color:var(--encre-3);color:var(--encre-3)}
.piquet[data-statut="en_cours"] .croix{background:var(--rouge);border-color:var(--rouge);color:#fff}
.maintenant{position:relative;height:0;margin:3px 0 17px}
.maintenant:before{
  content:"";position:absolute;left:-27px;right:0;top:0;height:2px;background:var(--rouge);
}
.maintenant span{
  position:absolute;left:-79px;top:-8px;width:44px;text-align:right;
  font-family:var(--data);font-size:11px;color:#fff;background:var(--rouge);padding:1px 3px;
}
@media(max-width:480px){
  .maintenant:before{left:-24px}
  .maintenant span{left:-66px;width:34px}
}

/* ---------- carte chantier ---------- */
.chantier{
  border:1px solid var(--trait);border-left:4px solid var(--ardoise);
  background:#fff;padding:10px 12px;cursor:pointer;transition:border-color .12s,transform .12s;
}
.chantier:hover{border-color:var(--encre-3);border-left-color:var(--rouge)}
.chantier[data-priorite="haute"]{border-left-color:var(--rouge)}
.chantier[data-statut="realise"],.chantier[data-statut="termine"]{opacity:.62}
.chantier[data-statut="annule"]{opacity:.45}
.chantier .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.chantier .lib{font-family:var(--display);font-size:15.5px;font-variation-settings:"wght" 600,"wdth" 87.5}
.chantier .meta{color:var(--encre-2);font-size:13px;margin-top:3px}
.chantier .ref{font-family:var(--data);font-size:11.5px;color:var(--encre-3)}
td .ref{font-family:var(--data);font-size:11px;color:var(--encre-3);margin-top:1px;line-height:1.45}
.avanc{font-size:11.5px;color:var(--encre-2);margin-top:2px;line-height:1.45}

.etiq{
  display:inline-block;max-width:100%;white-space:normal;font-family:var(--data);font-size:10.5px;letter-spacing:.06em;
  text-transform:uppercase;padding:1px 6px;border:1px solid var(--trait);color:var(--encre-2);
  background:#F1F2EF;white-space:nowrap;
}
.etiq.rouge{color:#fff;background:var(--rouge);border-color:var(--rouge)}
.etiq.vert{color:#fff;background:var(--vert);border-color:var(--vert)}
.etiq.jaune{color:#4A3600;background:var(--jaune);border-color:var(--jaune)}
.etiq.gris{color:var(--encre-3)}
.etiq.brut{text-transform:none;letter-spacing:0;font-size:11px}

/* ---------- notes ---------- */
.saisie textarea{
  width:100%;min-height:74px;resize:vertical;padding:9px 10px;
  border:1px solid var(--trait);border-radius:2px;font-family:var(--corps);font-size:14.5px;
  background:#fff;color:var(--encre);
}
.saisie textarea:focus{outline:2px solid var(--rouge);outline-offset:-1px}
.ligne{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.note{border-top:1px dashed var(--trait);padding:10px 0}
.note:first-child{border-top:0;padding-top:2px}
.note .h{font-family:var(--data);font-size:12px;color:var(--encre-3)}
.note .txt{white-space:pre-wrap;margin-top:2px}
.note .lien{font-size:12.5px;color:var(--ardoise)}
.suite{
  margin-top:6px;padding:6px 9px;background:#FFF8E4;border-left:3px solid var(--jaune);font-size:13.5px;
}
.suite.retard{background:#FDECEC;border-left-color:var(--rouge)}
.suite.faite{background:#EFF6F1;border-left-color:var(--vert);opacity:.7;text-decoration:line-through}

/* ---------- points de vigilance ---------- */
.vigi{
  display:flex;gap:10px;align-items:flex-start;background:#fff;
  border:1px solid var(--trait);border-left:4px solid var(--ardoise);
  padding:9px 11px;margin-bottom:8px;
}
.vigi:last-child{margin-bottom:0}
.vigi[data-niveau="attention"]{border-left-color:var(--jaune);background:#FFFCF3}
.vigi[data-niveau="critique"]{border-left-color:var(--rouge);background:#FDF2F2}
.vigi .sig{
  font-family:var(--display);font-size:15px;line-height:1.2;flex:none;width:18px;text-align:center;color:var(--ardoise);
}
.vigi[data-niveau="attention"] .sig{color:var(--c-jaune,#B07E00)}
.vigi[data-niveau="critique"] .sig{color:var(--rouge)}
.vigi .corps{flex:1;min-width:0}
.vigi .txt{white-space:pre-wrap;font-size:14.5px}
.vigi .sous{font-size:11.5px;color:var(--encre-3);font-family:var(--data);margin-top:2px}
.vigi .outils{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.vigi.retard{border-left-style:dashed;border-left-width:5px;box-shadow:inset 0 0 0 1px rgba(216,35,42,.14)}
.vigi .depasse{
  display:inline-block;font-family:var(--data);font-size:10.5px;letter-spacing:.04em;
  color:#fff;background:var(--rouge);padding:1px 5px;margin-left:4px;text-transform:none;
}

/* ---------- compteur DT/DICT ---------- */
.cpt-tete{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.cpt-nb{
  font-family:var(--display);font-variation-settings:"wght" 700,"wdth" 75;
  font-size:46px;line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums;
}
.cpt-obj{font-family:var(--data);font-size:14px;color:var(--encre-2);padding-bottom:5px}
.cpt-etat{margin-left:auto;text-align:right;font-family:var(--data);font-size:12px;color:var(--encre-2);padding-bottom:4px}
.jauge{height:9px;background:var(--beton-2);border:1px solid var(--trait);margin:11px 0 4px;position:relative;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--ardoise);transition:width .25s}
.jauge.atteint i{background:var(--vert)}
.jauge b{
  position:absolute;top:-1px;bottom:-1px;width:2px;background:var(--rouge);
  font-size:0;
}
.cpt-detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-top:12px}
@media(max-width:620px){.cpt-detail{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cpt-detail div{border:1px solid var(--trait);background:#fff;padding:6px 9px}
.cpt-detail span{display:block;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--encre-3);font-family:var(--display)}
.cpt-detail b{font-family:var(--data);font-size:15px;font-weight:normal;font-variant-numeric:tabular-nums}
.reglette{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--encre-2);flex-wrap:wrap}
.reglette input{width:62px;text-align:center}

.sess{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px solid var(--trait);background:#fff;padding:8px 10px;margin-top:12px;
}
.sess.active{border-color:var(--rouge);background:#FDF4F4}
.sess .voyant{width:9px;height:9px;border-radius:50%;background:var(--encre-3);flex:none}
.sess.active .voyant{background:var(--rouge);animation:pulse 1.8s infinite}
.sess .chrono{font-family:var(--data);font-size:14px;font-variant-numeric:tabular-nums}
.sess .chrono b{font-weight:normal;color:var(--encre-2)}
.sess .bt{margin-left:auto}
.creneaux{font-family:var(--data);font-size:11.5px;color:var(--encre-3);margin-top:5px;line-height:1.6}

.cd-pause{
  font-family:var(--data);font-size:11.5px;color:#8C938E;cursor:pointer;
  border-bottom:1px dotted #4A514C;padding-bottom:1px;white-space:nowrap;
}
.cd-pause:hover{color:#fff;border-bottom-color:#8C938E}
.cd-pause.proche{color:#FFD466}
.cd-pause:empty{display:none}
#btnPause{border-color:#4A514C;color:#C9CFC9;background:transparent}
#btnPause:hover{border-color:#8C938E;color:#fff;opacity:1}

/* ---------- carte personnelle ---------- */
.carte-sec{margin-bottom:16px}
.carte-sec h4{
  font-family:var(--display);font-variation-settings:"wght" 600,"wdth" 87.5;font-size:13px;
  letter-spacing:.09em;text-transform:uppercase;margin:0;
  border-bottom:1px solid var(--encre);padding-bottom:3px;display:flex;align-items:baseline;gap:8px;
}
.carte-sec h4 em{font-style:normal;font-family:var(--corps);font-size:11.5px;letter-spacing:0;
  text-transform:none;color:var(--encre-2);font-weight:normal;margin-left:auto;text-align:right}
.carte-items{margin:8px 0 0}
.item{
  display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--trait);font-size:14px;
;flex-wrap:wrap}
.item:last-child{border-bottom:0}
.ordre{display:flex;flex-direction:column;gap:1px;flex:none}
.fl{border:1px solid var(--trait);background:var(--papier);color:var(--encre-2);
  font-size:8px;line-height:1;padding:2px 4px;cursor:pointer;font-family:var(--corps)}
.fl:hover:not(:disabled){background:var(--beton-2);color:var(--encre)}
.fl:disabled{opacity:.28;cursor:default}
.item .dur{font-family:var(--data);font-size:11.5px;color:var(--encre-3);flex:none}
.item .txt{flex:1;min-width:0}

/* ================= utilitaires ================= */
function $(s,r){return (r||document).querySelector(s)}
function esc(v){
  return String(v==null?"":v).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function pIso(s){var p=String(s||"").split("-");return new Date(+p[0],+p[1]-1,+p[2],12,0,0)}
function auj(){return iso(new Date())}
function hNow(){var d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}
function libDate(s){
  if(!dateValide(s)) return "";
  var d=pIso(s);
  return d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function dateValide(v){
  var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v||""));
  if(!m) return false;
  var a=+m[1],mo=+m[2],j=+m[3];
  if(a<1900 || a>2200 || mo<1 || mo>12 || j<1 || j>31) return false;
  var d=new Date(a,mo-1,j);      /* refuse le 31 fevrier, que JS decalerait en mars */
  return d.getFullYear()===a && d.getMonth()===mo-1 && d.getDate()===j;
}
function libCourt(s){
  if(!dateValide(s)) return "";
  return pIso(s).toLocaleDateString("fr-FR",{weekday:"short",day:"2-digit",month:"2-digit"});
}

/* ---- jours feries et jours ouvres ---- */
function paques(y){
  var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,
      f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
      h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,
      l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
      mo=Math.floor((h+l-7*m+114)/31),j=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,j,12,0,0);
}
var cacheFeries={};
function feries(y){
  if(cacheFeries[y]) return cacheFeries[y];
  var P=paques(y),o={};
  function plus(n){var d=new Date(P.getTime());d.setDate(d.getDate()+n);return d}
  o[y+"-01-01"]="Jour de l'an";
  o[iso(plus(1))]="Lundi de Pâques";
  o[y+"-05-01"]="Fête du travail";
  o[y+"-05-08"]="Victoire 1945";
  o[iso(plus(39))]="Ascension";
  o[iso(plus(50))]="Lundi de Pentecôte";
  o[y+"-07-14"]="Fête nationale";
  o[y+"-08-15"]="Assomption";
  o[y+"-11-01"]="Toussaint";
  o[y+"-11-11"]="Armistice 1918";
  o[y+"-12-25"]="Noël";
  cacheFeries[y]=o;
  return o;
}
function motifNonOuvre(s){
  var d=pIso(s),jo=D.parametres.jours_ouvres||[1,2,3,4,5];
  if(jo.indexOf(d.getDay())===-1) return d.getDay()===0?"dimanche":(d.getDay()===6?"samedi":"jour non travaillé");
  var f=feries(d.getFullYear())[s];
  if(f) return f;
  if((D.parametres.absences||[]).indexOf(s)!==-1) return "absence";
  return null;
}
function prochainOuvre(depuis){
  var d=pIso(depuis||auj());
  for(var i=0;i<400;i++){
    d.setDate(d.getDate()+1);
    var s=iso(d);
    if(!motifNonOuvre(s)) return s;
  }
  return iso(d);
}

  if(r.auto==="dtdict") (D.dtdict||[]).forEach(function(c){ if(jours.indexOf(c.date)!==-1) t+=minutesSession(c) });
  else if(r.auto==="appels") (D.appels||[]).forEach(function(a){ if(jours.indexOf(a.date)!==-1) t+=+a.duree||0 });
  return t;

function minutesRubrique(rid,jours){
  var t=0;
  (D.notes||[]).forEach(function(n){
    if(n.rubrique_id===rid && jours.indexOf(n.date)!==-1) t+=+n.duree||0;
  });
  return t+minutesAuto(rubriquePar(rid),jours);
}
function minutesParDossier(jours){
  var m={};
  (D.notes||[]).forEach(function(n){
    if(!n.chantier_id || jours.indexOf(n.date)===-1) return;
    var d=+n.duree||0;
    if(d) m[n.chantier_id]=(m[n.chantier_id]||0)+d;
  });
  D.chantiers.forEach(function(c){          /* une activite close compte sa duree tenue */
    if(!estClos(c) || jours.indexOf(c.date)===-1) return;
    var d=+c.duree||0;
    if(d>(m[c.id]||0)) m[c.id]=d;           /* les notes priment si elles totalisent davantage */
  });
  return m;
}

  });
  return {lien:sansLien,temps:sansTemps};
}

function vigilanceEnRetard(v){

function vigilancesDu(date,strict){
  return (D.vigilances||[]).filter(function(v){
    if(v.clos) return false;
    if(v.permanent) return true;
    /* la date est une echeance : le point vaut jusqu'a ce jour, et reste affiche au-dela */
    if(strict) return !v.date || v.date>=date;   /* encore valable ce jour-la */
    return true;                                  /* aujourd'hui : tout ce qui n'est pas leve */
  }).sort(function(a,b){
    var r=(vigilanceEnRetard(b)?1:0)-(vigilanceEnRetard(a)?1:0);
    if(r) return r;                       /* les retards d'abord */
    return (RANG[a.niveau]||9)-(RANG[b.niveau]||9);
  });
}
function compteurDu(date,creer){
  var l=D.dtdict||(D.dtdict=[]);
  for(var i=0;i<l.length;i++) if(l[i].date===date) return l[i];
  if(!creer) return null;
  var p=D.parametres.dtdict||{heures:3,cadence:15};
  var c={date:date,heures:+p.heures||0,cadence:+p.cadence||0,traites:0,jalons:[],sessions:[]};
  l.push(c);

}
function minutes(h){var p=String(h||"0:0").split(":");return (+p[0])*60+(+p[1]||0)}
function hhmm(m){
  m=Math.max(0,Math.round(m));
  return String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}
function sessionOuverte(c){
  if(!c || !c.sessions) return null;
  for(var i=c.sessions.length-1;i>=0;i--) if(!c.sessions[i].fin) return c.sessions[i];
  return null;
}
function minutesSession(c){
  if(!c || !c.sessions || !c.sessions.length) return 0;
  var t=0,n=minutes(hNow()),estAuj=(c.date===auj());
  c.sessions.forEach(function(s){
    var d=minutes(s.debut),f;
    if(s.fin) f=minutes(s.fin);
    else if(estAuj) f=n;      /* session en cours aujourd'hui */
    else return;              /* session oubliee un jour passe : jamais extrapolee */
    if(f>d) t+=f-d;
  });
  return t;
}

function cadenceReelle(c){
  if(!c || !c.traites) return null;
  var ms=minutesSession(c);
  if(ms>=5) return c.traites/(ms/60);        // base chronometre : la plus fiable
  if(!c.jalons || c.jalons.length<2) return null;
  var d=minutes(c.jalons[0].h), f=minutes(c.jalons[c.jalons.length-1].h), ecart=f-d;
  if(ecart<6) return null;
  var apres=0;
  for(var i=1;i<c.jalons.length;i++) apres+=c.jalons[i].n;
  if(apres<=0) return null;
  return apres/(ecart/60);
}
function dureeLisible(min){
  min=Math.max(0,Math.round(min));
  var h=Math.floor(min/60),m=min%60;
  return h? (h+" h "+(m<10?"0":"")+m) : (m+" min");
}

function estTableau(v){ return Object.prototype.toString.call(v)==="[object Array]" }

function validerDonnees(o){
  if(!estObjet(o)) return "Ce fichier ne contient pas un objet de données.";
  var cols=["chantiers","notes","vigilances","dtdict","appels"],i;
  for(i=0;i<cols.length;i++)

  if(o.parametres){

    if(o.parametres.rubriques!==undefined && !estTableau(o.parametres.rubriques))

function analyser(txt){

  if(!t) return {vide:true};
  var o;
  try{ o=JSON.parse(t) }catch(e){ return {illisible:true} }
  if(!estObjet(o) || !estTableau(o.chantiers) || !estTableau(o.notes)) return {etranger:true};

function appliquerTexte(texte,mode){
  var t=String(texte).trim();
  t=t.replace(/^\s*(?:window\.)?PSTP?_(?:DATA|PILOT)\s*=\s*/,"").replace(/;\s*$/,"");
  var o;
  try{ o=JSON.parse(t) }catch(e){ toast("Fichier illisible : ce n'est pas du JSON valide",true); return }
  if(!estObjet(o) || o.chantiers===undefined || o.notes===undefined){
    toast("Fichier non reconnu : ce n'est pas un export de données du pilotage",true); return;
  }
  var pb=validerDonnees(o);
  if(pb){ toast("Fichier refusé — "+pb+" Vos données actuelles sont intactes.",true); return }
  if(mode==="fusionner"){
    var vusC={},vusN={};
    D.chantiers.forEach(function(c){vusC[c.id]=1});
    D.notes.forEach(function(n){vusN[n.id]=1});
    var ajC=0,ajN=0;
    (o.chantiers||[]).forEach(function(c){ if(!vusC[c.id]){D.chantiers.push(c);ajC++} });
    (o.notes||[]).forEach(function(n){ if(!vusN[n.id]){D.notes.push(n);ajN++} });
    toast("Fusion : "+ajC+" activité(s) et "+ajN+" note(s) ajoutées");
  }else{
    D=normaliser(o); M=D.carte;
    marquerCharge();
    toast("Données remplacées : "+D.chantiers.length+" activité(s), "+D.notes.length+" note(s)");
    if(ORPHELINS.n) setTimeout(function(){
      toast(ORPHELINS.n+" fiche(s) portaient une catégorie inconnue et ont été rattachées à "
        +ORPHELINS.vers+" — voir Données",true);

}

/* ================= identite visuelle =================
   Styles : "dossier" | "dossier-large" | "dossier-trait" | "engrenage"
   Une seule ligne a changer pour basculer d'icone.                      */
var ICONE_STYLE = "dossier";
function engrenage(cx,cy,ro,ri,n){
  n=n||8;
  var p=[],st=Math.PI/n,i,r,a;
  for(i=0;i<2*n;i++){
    r = i%2 ? ri : ro;
    a = i*st-st*0.34; p.push((cx+r*Math.cos(a)).toFixed(2)+" "+(cy+r*Math.sin(a)).toFixed(2));
    a = i*st+st*0.34; p.push((cx+r*Math.cos(a)).toFixed(2)+" "+(cy+r*Math.sin(a)).toFixed(2));
  }
  return "M"+p.join(" L")+" Z";
}
function iconeSVG(fond,dossier,roue){

var ctxAudio=null, titreBase="PST Pilot", clignote=false, dureeAppel=0;

function appelsDu(date){

function bip(n){
  try{
    var A=window.AudioContext||window.webkitAudioContext;
    if(!A) return;
    ctxAudio=ctxAudio||new A();
    if(ctxAudio.state==="suspended") ctxAudio.resume();
    var t0=ctxAudio.currentTime;
    for(var i=0;i<(n||2);i++){
      var o=ctxAudio.createOscillator(),g=ctxAudio.createGain(),d=t0+i*0.28;
      o.type="sine"; o.frequency.value=i%2?740:880;
      g.gain.setValueAtTime(0.0001,d);
      g.gain.exponentialRampToValueAtTime(0.12,d+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,d+0.20);
      o.connect(g); g.connect(ctxAudio.destination);
      o.start(d); o.stop(d+0.22);
    }
  }catch(e){}
}

  return d;

function chercherContact(tel){
  var n=telNorm(tel),i;
  if(n.length<6) return null;
  var l=(D.appels||[]).slice().reverse();
  for(i=0;i<l.length;i++)
    if(telNorm(l[i].tel)===n && (l[i].qui||l[i].entreprise))
      return {qui:l[i].qui||"",entreprise:l[i].entreprise||"",commune:l[i].commune||""};
  for(i=0;i<D.chantiers.length;i++)
    if(telNorm(D.chantiers[i].contact_tel)===n && (D.chantiers[i].contact_nom||D.chantiers[i].tiers))
      return {qui:D.chantiers[i].contact_nom||"",entreprise:D.chantiers[i].tiers||"",
              commune:D.chantiers[i].commune||""};
  return null;
}

function tempsDispo(){
  var l=chantiersDu(auj()), n=minutes(hNow()), best=null;
  l.forEach(function(c){
    if(!c.heure || estClos(c) || estAnnule(c)) return;

var ORDRE_REPLI={
  amuse:["amuse","accomp","plat"],
  accomp:["accomp","amuse","plat"],
  plat:["plat","amuse","accomp"],
  specialite:["specialite","plat"],
  dessert:["dessert"]
};
function libSection(cle){
  for(var i=0;i<MENU_SECTIONS.length;i++) if(MENU_SECTIONS[i][0]===cle) return MENU_SECTIONS[i][1];
  return cle;
}
function proposer(cle,motif,maxMin){
  if(!M.reglages.suggerer) return false;
  var ordre=ORDRE_REPLI[cle]||[cle],it=null,pris=cle,deborde=false,i;
  for(i=0;i<ordre.length && !it;i++){ it=tirer(ordre[i],maxMin); if(it) pris=ordre[i] }
  if(!it && maxMin!=null){
    for(i=0;i<ordre.length && !it;i++){ it=tirer(ordre[i],null); if(it){ pris=ordre[i]; deborde=true } }
  }
  if(!it) return false;
  var sup=[];
  if(deborde) sup.push("rien ne tient dans ce créneau");
  if(pris!==cle) sup.push("pioché dans « "+libSection(pris).toLowerCase()+" »");
  suggestion={cle:pris,motif:motif+(sup.length?" · "+sup.join(" · "):""),
    item:it,limite:(maxMin!=null&&!deborde)?maxMin:null};
  return true;
}
function suggererCloture(c){
  if(!M.reglages.suggerer) return;
  if(c.eprouvante && M.reglages.sur_eprouvante!==false){
    if(proposer("amuse","après une activité éprouvante — prenez le temps qu'il faut",null)) setTimeout(fenetrePause,60);
    return;
  }
  if(M.reglages.sur_cloture===false) return;
  var d=(M.reglages.filtrer_duree!==false)?tempsDispo():null;
  if(proposer("amuse", d!=null?("activité close · "+dureeLisible(d)+" avant la suivante"):"activité close", d)) setTimeout(fenetrePause,60);
}

var filtreLienQ="", filtreLienCat="", nbLien=0;
function correspondLien(c,q){
  if(!q) return true;
  return [c.libelle,c.reference,c.prm,c.poste,c.gdo,c.segment,c.commune,c.tiers,c.type,c.statut]
    .join(" ").toLowerCase().indexOf(q)!==-1;
}
function optionsLien(sel){
  var q=(filtreLienQ||"").toLowerCase(),cat=filtreLienCat||"";
  var o='<option value="0">— aucun —</option>';
  nbLien=0;
  var r=rubriques().filter(function(x){
    if(cat) return false;                       /* filtrer sur une categorie masque les rubriques */
    return !q || x.nom.toLowerCase().indexOf(q)!==-1 || sel==="r:"+x.id;
  });
  if(r.length){
    nbLien+=r.length;
    o+='<optgroup label="Rubriques">'+r.map(function(x){
      return '<option value="r:'+esc(x.id)+'"'+(sel==="r:"+x.id?" selected":"")+'>'+esc(x.nom)+'</option>';
    }).join("")+'</optgroup>';
  }
  var horsFiltre=null;
  var l=D.chantiers.filter(function(c){
    var ok=!estArchive(c) && (!cat || (c.categorie||"chantier")===cat) && correspondLien(c,q);
    if(!ok && sel==="c:"+c.id) horsFiltre=c;    /* choix courant, ou archive : mis a part */
    return ok;
  }).sort(function(a,b){return (b.date||"")===(a.date||"")?String(a.libelle||"").localeCompare(String(b.libelle||"")):(b.date||"").localeCompare(a.date||"")});
  var trop=l.length>150;
  if(trop){
    /* le troncage pouvait faire disparaitre l'option selectionnee : le navigateur
       retombait alors sur la premiere option et l'enregistrement suivant deplaçait
       ou effaçait le rattachement. Le choix courant est toujours conserve. */
    var garde=null;
    l.forEach(function(c){ if(sel==="c:"+c.id) garde=c });
    l=l.slice(0,150);
    if(garde){
      var dedans=false;
      l.forEach(function(c){ if(c.id===garde.id) dedans=true });
      if(!dedans) l.unshift(garde);
    }
  }
  if(l.length){
    nbLien+=l.length;
    o+='<optgroup label="Activités">'+l.map(function(c){
      var d=dateValide(c.date)?libCourt(c.date):"non datée";
      return '<option value="c:'+esc(c.id)+'"'+(sel==="c:"+c.id?" selected":"")+'>'
        +esc(d+" · "+catDe(c).sym+" "+(c.libelle||"")+(c.commune?" ("+c.commune+")":""))+'</option>';
    }).join("")+'</optgroup>';
  }
  if(trop) o+='<option value="0" disabled>… affinez la recherche pour voir la suite</option>';
  if(horsFiltre){
    o+='<optgroup label="Choix actuel (hors filtre)"><option value="c:'+esc(horsFiltre.id)+'" selected>'
      +esc((dateValide(horsFiltre.date)?libCourt(horsFiltre.date):"non datée")+" · "+catDe(horsFiltre).sym+" "
        +(horsFiltre.libelle||""))+'</option></optgroup>';
  }
  return o;
}

function lienDe(n){ return n.rubrique_id?("r:"+n.rubrique_id):(n.chantier_id?("c:"+n.chantier_id):"0") }
function poserLien(n,v){
  v=String(v||"");
  /* un champ absent ou vide ne vaut pas « detacher » : seul le choix explicite « aucun »
     (valeur 0) rompt le lien. Sans cette distinction, tout chemin de code qui lisait le
     formulaire sans que le champ soit rendu effaçait le rattachement en silence. */
  if(!v) return;
  if(v==="0"){ souvenirLien(n); n.rubrique_id=""; n.chantier_id=""; return }
  n.rubrique_id = v.indexOf("r:")===0 ? v.slice(2) : "";
  n.chantier_id = v.indexOf("c:")===0 ? v.slice(2) : "";
  if(n.chantier_id) n.chantier_ref=refDossier(chantierPar(n.chantier_id));
  else if(n.rubrique_id) n.chantier_ref="";
}

function souvenirLien(n){

var horizonAttente=7;                 /* une semaine au demarrage */
/* -1 = echeance a aujourd'hui ou deja depassee. Les horizons positifs, eux, embarquent
   aussi les taches sans echeance : c'est une reserve, pas une liste du jour. */
var HORIZONS=[[-1,"Aujourd\u2019hui"],[7,"1 sem."],[14,"2 sem."],[21,"3 sem."],[30,"1 mois"],[0,"Tout"]];
function suitesHorizon(){
  var l=suitesOuvertes();
  if(horizonAttente===-1){
    var h=auj();
    return l.filter(function(n){ return n.suite.echeance && n.suite.echeance<=h });
  }
  if(!horizonAttente) return l;
  var d=new Date(); d.setDate(d.getDate()+horizonAttente);
  var lim=iso(d);
  return l.filter(function(n){ return !n.suite.echeance || n.suite.echeance<=lim });
}
function suitesDuJour(){
  var h=auj();
  return suitesOuvertes().filter(function(n){ return n.suite.echeance && n.suite.echeance<=h });
}
function fragAttente(){

  var barre='<div class="ligne" style="margin:0 0 10px">'

        /* le compte du jour reste visible meme depuis un autre horizon */
        var n=(h[0]===-1)?suitesDuJour().length:0;
        return '<button class="b mini'+(horizonAttente===h[0]?"":" creux")+'" data-hor="'+h[0]+'">'

      }).join("")
    +(tot>l.length?'<span class="note-aide" style="margin:0 0 0 auto">'
        +(horizonAttente===-1?(tot-l.length)+' au-del\u00e0':(tot-l.length)+' plus loin')+'</span>':"")
  +'</div>';
  if(!l.length) return barre+'<div class="vide"><b>'
    +(horizonAttente===-1?'Rien à échéance aujourd\u2019hui':'Rien dans cet horizon')+'</b>'
    +(tot?'Élargissez le filtre pour voir les '+tot+' tâche(s) en attente.':'Les tâches à faire apparaîtront ici.')+'</div>';
  return barre+l.map(function(n){
    var s=n.suite,retard=s.echeance&&s.echeance<auj();
    var c=n.chantier_id?chantierPar(n.chantier_id):null;
    return '<div class="note"><div class="h">'
      +(s.echeance?(retard?'<span style="color:var(--rouge)">échéance '+libCourt(s.echeance)+' — en retard</span>'
                          :'échéance '+libCourt(s.echeance)):'sans échéance')
      +' · noté le '+libCourt(n.date)+'</div>'
      +'<div class="txt">'+esc(s.texte)+'</div>'
      +(c?'<div class="lien">↳ '+esc(c.libelle)+'</div>':"")

  var reste=Math.max(0,Math.ceil((prochainRappelJour-Date.now())/60000));

/* ============ lecteur XLSX autonome : ZIP + XML, sans bibliotheque ============ */
function zipOuvrir(buf){
  var dv=new DataView(buf),u8=new Uint8Array(buf),eocd=-1,i;
  for(i=u8.length-22;i>=0 && i>u8.length-66000;i--){
    if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break }
  }
  if(eocd<0) throw new Error("Ce fichier n'est pas une archive Excel valide");
  var nb=dv.getUint16(eocd+10,true),off=dv.getUint32(eocd+16,true),p=off,ent=[],dec=new TextDecoder();
  for(var k=0;k<nb;k++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    var meth=dv.getUint16(p+10,true),tc=dv.getUint32(p+20,true);
    var ln=dv.getUint16(p+28,true),lx=dv.getUint16(p+30,true),lc=dv.getUint16(p+32,true);
    var lh=dv.getUint32(p+42,true);
    ent.push({nom:dec.decode(u8.subarray(p+46,p+46+ln)),meth:meth,tc:tc,lh:lh});
    p+=46+ln+lx+lc;
  }
  return {u8:u8,dv:dv,ent:ent};
}
function zipLire(z,nom){
  var e=null;
  z.ent.forEach(function(x){ if(x.nom===nom) e=x });
  if(!e) return Promise.resolve(null);
  var p=e.lh;
  if(z.dv.getUint32(p,true)!==0x04034b50) return Promise.reject(new Error("Entrée corrompue"));
  var ln=z.dv.getUint16(p+26,true),lx=z.dv.getUint16(p+28,true),deb=p+30+ln+lx;
  var brut=z.u8.subarray(deb,deb+e.tc);
  if(e.meth===0) return Promise.resolve(new TextDecoder().decode(brut));
  if(typeof DecompressionStream!=="function")
    return Promise.reject(new Error("Ce navigateur ne sait pas décompresser (Edge 103+ requis)"));
  var ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();
  w.write(brut); w.close();
  return new Response(ds.readable).text();
}

  return n;
}
function xlChaines(xml){
  if(!xml) return [];
  var doc=new DOMParser().parseFromString(xml,"application/xml"),si=doc.getElementsByTagName("si"),l=[];
  for(var i=0;i<si.length;i++){
    var ts=si[i].getElementsByTagName("t"),s="";
    for(var j=0;j<ts.length;j++) s+=ts[j].textContent;
    l.push(s);
  }
  return l;
}
function xlLignes(xml,ch){
  var doc=new DOMParser().parseFromString(xml,"application/xml");
  var err=doc.getElementsByTagName("parsererror");
  if(err.length) throw new Error("Feuille illisible");
  var rows=doc.getElementsByTagName("row"),out=[];
  for(var i=0;i<rows.length;i++){
    var cs=rows[i].getElementsByTagName("c"),lg=[];
    for(var j=0;j<cs.length;j++){
      var c=cs[j],t=c.getAttribute("t"),idx=colNum(c.getAttribute("r"))||j+1,v="";
      if(t==="inlineStr"){ var is=c.getElementsByTagName("t"); v=is.length?is[0].textContent:"" }
      else{
        var vn=c.getElementsByTagName("v");
        if(vn.length){ v=vn[0].textContent; if(t==="s") v=ch[+v]||"" }
      }
      lg[idx-1]=v;
    }
    out.push(lg);
  }
  return out;
}
function xlLire(buf){
  var z;
  try{ z=zipOuvrir(buf) }catch(e){ return Promise.reject(e) }
  var feuille=null;
  z.ent.forEach(function(x){
    if(!feuille && /^xl\/worksheets\/sheet\d+\.xml$/.test(x.nom)) feuille=x.nom;
  });
  if(!feuille) return Promise.reject(new Error("Aucune feuille trouvée dans le classeur"));
  return zipLire(z,"xl/sharedStrings.xml").then(function(sx){
    var ch=xlChaines(sx);
    return zipLire(z,feuille).then(function(fx){ return xlLignes(fx,ch) });
  });
}
function serieDate(v){
  var n=+v;
  if(!n || n<20000 || n>80000) return "";
  var ms=Date.UTC(1899,11,30)+n*86400000,d=new Date(ms);
  return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0");
}

function valeurCol(lg,def){
  var v=lg[def.c-1];
  v=(v==null?"":String(v)).trim();
  if(def.date && v && /^[0-9]+([.,][0-9]+)?$/.test(v)){
    var d=serieDate(v);
    if(d) return d;
  }
  return v;
}
function statutDepuisEtat(e){
  e=String(e||"");
  if(e.indexOf("λ")===0) return "realise";
  if(e.indexOf("α")===0) return "planifie";
  if(!e) return "planifie";
  return "en_cours";
}
function normPRM(v){ return String(v||"").replace(/[^0-9]/g,"") }
function desherencePar(prm){
  var p=normPRM(prm),t=null;
  if(!p) return null;
  var kc=(catImport()||{cle:"chantier"}).cle;
  D.chantiers.forEach(function(c){
    if((c.categorie||"chantier")===kc && normPRM(c.prm)===p) t=c;
  });
  return t;
}
function catImport(){
  var l=categories(),i;
  for(i=0;i<l.length;i++) if(l[i]["import"]) return l[i];
  return l[0]||null;
}
function champsImport(){
  var K=catImport();
  return (K?K.champs:[]).filter(function(f){ return f.col>0 })
    .map(function(f){ return {c:f.col,k:f.cle,lib:f.lib,date:f.type==="date",liste:f.liste} });
}
function ligneVersDesh(lg){
  var o={};

}

function diagImport(){
  /* le filtre gestionnaire ne tient qu'a la configuration de la categorie : s'il manque,
     l'import avale toutes les lignes du fichier sans que rien ne le signale. */
  var K=catImport(),d={cat:K?(K.plur||K.lib):"(aucune)",cle:K?K.cle:"",cols:champsImport().length,
    marque:!!(K&&K["import"]),filtre:champFiltre(),

  if(d.filtre) champsImport().forEach(function(x){ if(x.k===d.filtre) d.champConnu=true });

function memeGestionnaire(o){

  var f=(D.parametres.gestionnaire||"").trim().toLowerCase();
  if(!f) return true;                        /* filtre vide : on prend tout */
  return String(o[cle]||"").trim().toLowerCase()===f;

function sansAccent(v){
  return String(v||"").normalize?String(v).normalize("NFD").replace(/[\u0300-\u036f]/g,""):String(v||"");
}
function estMarqueFait(v){
  var t=sansAccent(v).trim().toUpperCase().replace(/[.\s]+$/,"");
  if(!t) return false;
  var l=D.parametres.marqueurs_fait||MARQUEURS_FAIT,ok=false;
  l.forEach(function(m){ if(sansAccent(m).trim().toUpperCase()===t) ok=true });
  return ok;
}

function datesIllisibles(o){
  /* une colonne date qui contient « FAIT », « OK », une remarque : on le signale sans bloquer */
  var l=[];
  champsDate().forEach(function(def){
    var v=String(o[def.k]||"").trim();
    if(v && !dateValide(v)) l.push({lib:def.lib,val:v,fait:estMarqueFait(v)});
  });
  return l;
}
function analyserImport(lignes){
  var nouv=[],maj=[],inchange=0,ignorees=0,autres=0,vus={},flous=[],revenus=[];
  for(var i=2;i<lignes.length;i++){          /* ligne 1 = titres de groupe, ligne 2 = en-tetes */
    var lg=lignes[i]||[],o=ligneVersDesh(lg);
    if(!memeGestionnaire(o)){ autres++; continue }
    if(!normPRM(o.prm)){ ignorees++; continue }
    vus[normPRM(o.prm)]=1;
    var di=datesIllisibles(o);
    if(di.length) flous.push({prm:normPRM(o.prm),l:di});
    var ex=desherencePar(o.prm);
    if(!ex){ nouv.push(o); continue }
    if(estArchive(ex)) revenus.push(ex);      /* archive mais de retour dans mon perimetre */
    var diffs=[];
    champsImport().forEach(function(def){
      var av=(ex[def.k]==null?"":String(ex[def.k])),ap=o[def.k]||"";
      if(!ap) return;                 /* cellule vide : rien ne sera ecrase, rien a montrer */
      if(av!==ap) diffs.push({lib:def.lib,av:av,ap:ap});
    });
    var lib=libelleDesh(o);
    var perso=(libellePerso(ex) && lib!==ex.libelle) ? {actuel:ex.libelle,propose:lib} : null;
    if(diffs.length || perso) maj.push({cible:ex,val:o,diffs:diffs,perso:perso}); else inchange++;
  }
  /* dossiers presents chez moi mais plus dans le fichier filtre : changement de gestionnaire,
     cloture, sortie du perimetre. Jamais supprime d'office : propose au cas par cas. */
  var absents=[],dg=diagImport();
  if(dg.applique){
    var kc=(catImport()||{cle:"chantier"}).cle;
    D.chantiers.forEach(function(c){
      if((c.categorie||"chantier")!==kc) return;
      var pr=normPRM(c.prm); if(!pr) return;
      if(!vus[pr]) absents.push(c);
    });
  }
  return {nouv:nouv,maj:maj,inchange:inchange,ignorees:ignorees,autres:autres,revenus:revenus,
          absents:absents,flous:flous,filtreOk:dg.applique,total:Math.max(0,lignes.length-2)};
}
function libellePerso(c){
  return c && c.libelle_auto!=null && c.libelle!==c.libelle_auto;
}
function libelleDesh(o){
  var K=catImport();
  if(!K || K.regle_lib!=="segment"){
    var v="";
    (K?K.champs:[]).forEach(function(f){ if(!v && o[f.cle] && f.type==="texte") v=String(o[f.cle]).trim() });
    return v || (normPRM(o.prm)?("PRM "+normPRM(o.prm)):"Sans libellé");
  }
  var seg=String(o.segment||"").trim().toUpperCase();
  var poste=String(o.poste||"").trim();
  var client=String(o.nom_client||"").trim();
  var prm=normPRM(o.prm);
  var repli=prm?("PRM "+prm):"Sans libellé";
  if(seg==="C1"||seg==="C2"||seg==="C3") return poste||"Nom de poste manquant";
  if(seg==="C4") return client||repli;
  return client||poste||repli;
}
function appliquerDesh(c,o,garderLib){
  /* le reporting ne renseigne pas toujours toutes les colonnes : une cellule vide
     est une absence d'information, jamais une demande d'effacement. */
  champsImport().forEach(function(def){
    var v=o[def.k];
    if(v==null || String(v).trim()==="") return;
    c[def.k]=v;
  });
  c.reference=o.prm;
  var lib=libelleDesh(o);
  if(!(garderLib && libellePerso(c))) c.libelle=lib;
  c.libelle_auto=lib;                    /* trace du libelle genere, pour detecter vos retouches */
  if(o.nom_client) c.tiers=o.nom_client;
  var Ki=catImport(),st=(Ki&&Ki.miroir?o[Ki.miroir]:"");
  if(st) c.statut=st;
  /* la colonne date sert aussi de marqueur. Une vraie date planifie ; « FAIT » et
     consorts retirent la fiche du planning ; tout autre texte laisse la date en place. */
  if(dateValide(o.date_interv)) c.date=o.date_interv;
  else if(estMarqueFait(o.date_interv)) c.date="";
  return c;
}

function reparerImportCat(){
  var K=catImport(); if(!K){ toast("Aucune catégorie à réparer",true); return }
  var mod=null;
  modeleCategories().forEach(function(x){ if(x.cle==="chantier") mod=x });
  if(!mod){ toast("Modèle introuvable",true); return }
  var av={cols:champsImport().length,filtre:champFiltre(),marque:!!K["import"]};
  K["import"]=true; K.filtre=mod.filtre; K.miroir=K.miroir||mod.miroir;
  K.regle_lib=K.regle_lib||mod.regle_lib; K.avancement=K.avancement||mod.avancement;
  if(!K.apercu || !K.apercu.length) K.apercu=mod.apercu.slice();
  /* on recable les colonnes du modele sans toucher aux champs que Stella a ajoutes */
  var vus={}; (K.champs||[]).forEach(function(f){ vus[f.cle]=f });
  mod.champs.forEach(function(f){
    if(vus[f.cle]){ vus[f.cle].col=f.col; if(!vus[f.cle].liste) vus[f.cle].liste=f.liste;
                    if(f.type!=="texte") vus[f.cle].type=f.type; }
    else K.champs.push({cle:f.cle,lib:f.lib,type:f.type,liste:f.liste,groupe:f.groupe,col:f.col});
  });
  modifie();
  var ap=diagImport();
  fermerModale();
  toast("Configuration réparée : "+ap.cols+" colonnes (avant "+av.cols+"), filtre « "
    +(ap.filtre||"aucun")+" ». Relancez l'import.");

function validerImport(ajouter,mettreAJour,supprimer){
  var r=importEnCours;
  if(!r) return;
  var a=0,m=0,sup=0,cibles={};
  if(supprimer){
    var bx=$("#modCorps").querySelectorAll("input.abs"),i;
    for(i=0;i<bx.length;i++) if(bx[i].checked) cibles[bx[i].getAttribute("data-id")]=1;
    var n=0; for(var k in cibles) if(cibles.hasOwnProperty(k)) n++;
    var qi=(supprimer==="traite")?"comme traités (comptés dans les affaires menées à terme)"
           :((supprimer==="sorti")?"comme sortis de votre périmètre (comptés à part)":"sans qualification");
    if(n && !confirm("Archiver "+n+" dossier(s) "+qi+" ?\n\nRien n'est supprimé : notes, tâches et rattachements sont conservés.")) return;
  }
  var e=$("#gardLib"),garder=e?e.checked:true;
  if(ajouter) r.nouv.forEach(function(o){
    D.chantiers.push(appliquerDesh({id:uid(),categorie:(catImport()||{cle:"chantier"}).cle,heure:"",duree:0,priorite:"normale",
      commune:"",adresse:"",contact_nom:"",contact_tel:"",commentaire:"",type:"",cree_le:new Date().toISOString()},o));
    a++;
  });
  if(mettreAJour) r.maj.forEach(function(x){ appliquerDesh(x.cible,x.val,garder); m++ });
  var re=$("#reactiv"),rea=0;
  if(mettreAJour && r.revenus && (!re || re.checked))
    r.revenus.forEach(function(c){ if(desarchiver(c)) rea++ });
  if(supprimer){
    var iss=(supprimer==="traite"||supprimer==="sorti")?supprimer:"";
    D.chantiers.forEach(function(c){ if(cibles[c.id] && archiver(c,"absent du reporting",iss)) sup++ });
  }
  importEnCours=null;
  fermerModale(); modifie(); rendre();
  toast(a+" ajoutée(s)"+(m?" · "+m+" mise(s) à jour":"")+(sup?" · "+sup+" archivée(s)":"")
    +(rea?" · "+rea+" réactivée(s)":""));
}
function appliquerConfig(txt){
  var o;
  try{ o=JSON.parse(String(txt)) }catch(e){ toast("Fichier de configuration illisible",true); return }
  if(!estObjet(o) || o.type!=="pst-pilot-config" || !estTableau(o.categories)){
    toast("Ce fichier n'est pas une configuration de catégories",true); return;
  }
  if(!o.categories.length){ toast("Cette configuration ne contient aucune catégorie",true); return }
  var n=o.categories.length;
  if(!confirm("Remplacer vos "+categories().length+" catégorie(s) par les "+n+" du fichier ?\n\nVos activités et vos notes ne sont pas touchées.")) return;
  D.parametres.categories=o.categories.map(normaliserCat);
  var aj=0;
  if(o.listes) for(var k in o.listes) if(o.listes.hasOwnProperty(k) && !D.parametres[k]){ D.parametres[k]=o.listes[k]; aj++ }
  var connues={};
  categories().forEach(function(K){ connues[K.cle]=1 });
  var orph=0,prem=(categories()[0]||{}).cle||"chantier";
  D.chantiers.forEach(function(c){ if(!connues[c.categorie||"chantier"]){ c.categorie=prem; orph++ } });
  modifie(); rendre();
  toast("Configuration importée : "+n+" catégorie(s)"+(aj?" · "+aj+" liste(s) ajoutée(s)":"")+(orph?" · "+orph+" activité(s) rattachée(s)":""));
}
function tropGros(f){
  if(f && f.size>TAILLE_MAX){
    toast("Fichier trop volumineux ("+Math.round(f.size/1048576)+" Mo). Limite : 25 Mo.",true);
    return true;
  }
  return false;
}
function importerXlsx(f){
  if(tropGros(f)) return;
  var fr=new FileReader();
  fr.onload=function(){
    xlLire(fr.result).then(function(lignes){
      if(!lignes || lignes.length<3){ toast("Fichier vide ou sans données",true); return }
      ecranImport(analyserImport(lignes));
    }).catch(function(e){ toast("Lecture impossible : "+(e.message||"erreur"),true) });
  };
  fr.onerror=function(){ toast("Fichier illisible",true) };
  fr.readAsArrayBuffer(f);
}

function csv(entetes,lignes){
  function c(v){ v=String(v==null?"":v); return '"'+v.replace(/"/g,'""')+'"' }
  return "\uFEFF"+[entetes.map(c).join(";")].concat(lignes.map(function(l){return l.map(c).join(";")})).join("\r\n");

function dansPeriode(d){
  if(!d) return false;
  if(perDeb && d<perDeb) return false;
  if(perFin && d>perFin) return false;
  return true;
}
function suffixePeriode(){
  if(perDeb && perFin) return perDeb+"_"+perFin;
  if(perDeb) return "depuis-"+perDeb;
  if(perFin) return "jusqu-"+perFin;
  return auj();
}

function libRattachement(n){

function compteRendu(jour){
  var d=jour||auj(),ch=chantiersDu(d),no=notesDu(d).slice().reverse();
  var t="Compte-rendu d'activité — "+libDate(d)+"\n"+"=".repeat(46)+"\n\n";
  var vg=vigilancesDu(d,d!==auj());
  if(vg.length){
    t+="POINTS DE VIGILANCE ("+vg.length+")\n";
    t+=vg.map(function(v){
      return "- ["+(v.niveau||"info").toUpperCase()+"] "+v.texte+(v.origine?"  ("+v.origine+")":"")
        +(vigilanceEnRetard(v)?"  [date dépassée depuis "+joursEcoules(v.date)+" j]":"");
    }).join("\n")+"\n\n";
  }
  var cp=compteurDu(d,false);
  if(D.parametres.mod_dtdict!==false && cp && (cp.traites||cp.heures)){
    var ob=Math.round(cp.heures*cp.cadence),rl=cadenceReelle(cp),ms=minutesSession(cp);
    t+=String(D.parametres.titre_dtdict||"Compteur de traitement").toUpperCase()+"\n";
    t+="- "+cp.traites+" dossier(s) traités pour un objectif de "+ob
      +" ("+cp.heures+" h × "+cp.cadence+"/h)"
      +(ob?" — "+Math.round(cp.traites/ob*100)+" %":"")+"\n";
    if(ms) t+="- temps de traitement chronométré : "+dureeLisible(ms)
      +" ("+(cp.sessions||[]).map(function(s){return s.debut+"–"+(s.fin||"en cours")}).join(", ")+")\n";
    if(rl) t+="- cadence réelle constatée : "+fmtCad(rl)+" dossiers/h\n";
    t+="\n";
  }
  t+="PLANNING DU JOUR"+(ch.length?" — "+resume(ch).replace(/&[^;]+;/g,""):"")+"\n";
  if(!ch.length) t+="- rien de positionné ce jour (voir le journal pour l'activité réalisée)\n";
  t+="\n";
  categories().forEach(function(K2){
    var k=K2.cle;
    var sl=ch.filter(function(c){return (c.categorie||"chantier")===k});
    if(!sl.length) return;
    t+=String(K2.plur||K2.lib).toUpperCase()+" ("+sl.length+")\n";
    t+=sl.map(function(c){
      var sup="";
      if(k==="convocation" && c.presence && c.presence!=="attendu") sup="  ["+libPresence(c.presence)+"]";
      if(k==="animation" && c.participants) sup="  ("+c.participants+" participants)";
      return "- "+(c.heure||"--:--")+"  "+c.libelle+(c.commune?" ("+c.commune+")":"")
        +(c.tiers?" — "+c.tiers:"")+"  ["+libStatut(c.statut)+"]"+sup;
    }).join("\n")+"\n\n";
  });
  var ap=appelsDu(d).slice().reverse();
  if(D.parametres.mod_permanence!==false && ap.length){
    var tt=0; ap.forEach(function(a){ tt+=+a.duree||0 });
    t+="ASSISTANCE TÉLÉPHONIQUE ("+ap.length+" appel(s)"+(tt?", "+dureeLisible(tt)+" cumulées":"")+")\n";
    t+=ap.map(function(a){
      return "- "+(a.heure||"")+"  "+(a.qui||"appelant non précisé")
        +(a.motif?" ["+a.motif+"]":"")+(a.objet?" : "+a.objet:"")
        +(a.suite?"  → "+a.suite+(a.suite_faite?" (traité)":""):"");
    }).join("\n")+"\n\n";
  }
  t+="JOURNAL ("+no.length+" note(s))\n";
  t+= no.length? no.map(function(n){
    return "- "+(n.heure||"")+"  "+(n.type?"["+n.type+"] ":"")+(n.contenu||"(tâche)")+libRattachement(n);
  }).join("\n") : "- aucune";
  var s=suitesOuvertes();
  t+="\n\nÀ SUIVRE — état au "+libCourt(auj())+" ("+s.length+")\n";
  t+= s.length? s.map(function(n){
    var rt=n.suite.echeance&&n.suite.echeance<auj()?" [EN RETARD]":"";
    return "- "+n.suite.texte+(n.suite.echeance?"  (échéance "+libCourt(n.suite.echeance)+")":"")+rt+libRattachement(n);
  }).join("\n") : "- rien en attente";
  var suiv=prochainOuvre(d),cs=chantiersDu(suiv);
  t+="\n\nPLANNING DU PROCHAIN JOUR OUVRÉ — "+libDate(suiv)+" ("+cs.length+" entrée(s))\n";
  t+= cs.length? cs.map(function(c){
    return "- "+(c.heure||"--:--")+"  ["+catDe(c).lib+"] "+c.libelle+(c.commune?" ("+c.commune+")":"");
  }).join("\n") : "- rien de positionné";
  ouvrirModale("Compte-rendu — "+libDate(d),
    '<textarea id="crTxt" style="width:100%;min-height:340px;padding:10px;border:1px solid var(--trait);border-radius:2px;font-family:var(--data);font-size:12.5px">'+esc(t)+'</textarea>'
    +'<div class="note-aide">Prêt à coller dans un mail ou un compte-rendu.</div>',
    [{txt:"Fermer",fn:fermerModale},
     {txt:"Télécharger en .txt",classe:"creux",droite:true,fn:function(){
       telecharger("pstp-compte-rendu-"+d+".txt",$("#crTxt").value,"text/plain;charset=utf-8");
     }},
     {txt:"Copier",classe:"",droite:true,fn:function(){
       var e=$("#crTxt"); e.select();
       try{ document.execCommand("copy"); toast("Copié dans le presse-papiers") }
       catch(x){ toast("Copie impossible — sélectionnez le texte",true) }
     }}]);
}

/* « M PERONNET AISSAOUI » : la civilite se glisse dans le prenom a la saisie comme a l'import.
   On ne la retire que si un nom subsiste derriere, pour ne jamais vider un champ. */
function extraireCivilite(v){
  var t=String(v||"").trim();
  if(!t) return {civ:"",reste:""};
  var mots=t.split(/\s+/);
  var tete=sansAccent(mots[0]).toLowerCase().replace(/[.,]+$/,"");
  var civ="";
  CIV_FORMES.forEach(function(f){ if(!civ && f[0]===tete) civ=f[1] });
  if(!civ) return {civ:"",reste:t};
  var reste=mots.slice(1).join(" ").trim();
  if(!reste) return {civ:"",reste:t};        /* « M. » tout seul : c'est le nom, on n'y touche pas */
  return {civ:civ,reste:reste};
}
/* nomComplet sert aussi aux rapprochements : la civilite en est volontairement absente */
function nomAffiche(c){
  if(!c) return "";

function nomComplet(c){

function libNiveau(v){

function pairesRelation(){

}
function inverseRel(lib){
  var l=pairesRelation(),i;
  for(i=0;i<l.length;i++){
    if(l[i].lib===lib) return l[i].inv;
    if(l[i].inv===lib) return l[i].lib;

}
/* liens directs : ceux poses sur la fiche, et ceux poses par d'autres vers elle */
function cibleLien(l){

function nomCible(l){

function reseauDe(id){

    });

/* historique reconstitue depuis les appels et les activites */
function historiqueDe(c){

    if(a.nature==="verif") return;
    if(correspond(a.qui,a.tel))

  });
  D.chantiers.forEach(function(x){

function cleCandidat(nom,tel){

function dejaFiche(nom,tel){

  contacts().forEach(function(c){
    if(vu) return;

    if(n && c.nom && sansAccent(nomComplet(c)).toLowerCase().trim()===n){ vu=true; return }
    if(n && c.nom && n.indexOf(sansAccent(c.nom).toLowerCase())!==-1 && sansAccent(c.nom).length>3){ vu=true }
  });

function candidatsContacts(){
  var m={},ecartes=D.parametres.contacts_ecartes||[];
  function ajout(nom,tel,date,quoi,detail,lieu){
    nom=String(nom||"").trim(); tel=String(tel||"").trim();
    if(!nom && !tel) return;
    var cle=cleCandidat(nom,tel);
    if(!cle || ecartes.indexOf(cle)!==-1) return;
    if(dejaFiche(nom,tel)) return;
    if(!m[cle]) m[cle]={cle:cle,nom:nom,tel:tel,n:0,derniere:"",sources:{},exemples:[],lieu:lieu||""};
    var e=m[cle];

    if(nom && (!e.nom || nom.length>e.nom.length)) e.nom=nom;   /* garder la forme la plus complete */
    if(tel && !e.tel) e.tel=tel;
    if(lieu && !e.lieu) e.lieu=lieu;
    if(date && date>e.derniere) e.derniere=date;
    e.sources[quoi]=(e.sources[quoi]||0)+1;
    if(detail && e.exemples.length<3) e.exemples.push(detail);
  }
  (D.appels||[]).forEach(function(x){
    if(x.nature==="verif") return;
    ajout(x.qui,x.tel,x.date,"appel",x.objet||x.motif||"",x.commune||"");
  });
  D.chantiers.forEach(function(x){
    ajout(x.contact_nom,x.contact_tel,x.date,catDe(x).lib,x.libelle||"",x.commune||"");
  });
  var l=[];
  Object.keys(m).forEach(function(k){ l.push(m[k]) });
  l.sort(function(a,b){ return b.n-a.n || (b.derniere||"").localeCompare(a.derniere||"") });

}
/* « SARL Berthaud TP » et « BERTHAUD TP » sont la meme entreprise : on compare
   sur une forme reduite, sans forme juridique, sans accent ni ponctuation. */
var FORMES_JUR=["sarl","sas","sasu","sa","eurl","sci","scp","eirl","ets","ste","snc","scop",
  "gie","asso","association","cooperative","earl","gaec","sem","spl","epic","cci","ccas"];
function cleOrg(nom){
  var t=sansAccent(nom).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
  if(!t) return "";
  var mots=t.split(" ").filter(function(m){ return m && FORMES_JUR.indexOf(m)===-1 });
  if(!mots.length) mots=t.split(" ");
  return mots.join(" ");
}
function orgConnue(nom){
  var k=cleOrg(nom); if(!k) return null;
  var t=null;
  organisations().forEach(function(o){ if(!t && cleOrg(o.nom)===k) t=o });
  return t;
}
function catTiersType(cle){
  var K=catParCle(cle);

}
function candidatsOrgs(){
  var m={},ecartees=D.parametres.orgs_ecartees||[];
  function ajout(nom,date,quoi,commune){
    nom=String(nom||"").trim();
    if(nom.length<2) return;
    var cle=cleOrg(nom);
    if(!cle || ecartees.indexOf(cle)!==-1) return;
    if(orgConnue(nom)) return;
    if(!m[cle]) m[cle]={cle:cle,nom:nom,n:0,derniere:"",sources:{},communes:{}};
    var e=m[cle];
    e.n++;
    if(nom.length>e.nom.length) e.nom=nom;      /* la forme la plus complete fait foi */
    if(date && date>e.derniere) e.derniere=date;
    e.sources[quoi]=(e.sources[quoi]||0)+1;
    if(commune) e.communes[commune]=(e.communes[commune]||0)+1;
  }
  (D.appels||[]).forEach(function(x){
    if(x.nature==="verif") return;
    ajout(x.entreprise,x.date,"appel",x.commune||"");   /* champ dedie : aucune ambiguite */
  });
  D.chantiers.forEach(function(x){
    var tt=catTiersType(x.categorie||"chantier");
    if(tt==="personne") return;                         /* la categorie dit que c'est quelqu'un */
    ajout(x.tiers,x.date,catDe(x).lib,x.commune||"");
  });
  var l=[];
  Object.keys(m).forEach(function(k){
    var e=m[k],mx=0;
    Object.keys(e.communes).forEach(function(c){ if(e.communes[c]>mx){ mx=e.communes[c]; e.commune=c } });
    l.push(e);
  });
  l.sort(function(a,b){ return b.n-a.n || (b.derniere||"").localeCompare(a.derniere||"") });
  return l;
}
/* une fois l'organisation creee, les contacts croises sur les memes lignes lui sont rattaches */
function orgDuContact(c){
  var noms={},res=null;
  function vu(n){ if(n) noms[cleOrg(n)]=1 }
  (D.appels||[]).forEach(function(a){
    if(a.nature==="verif") return;
    if(memeInterlocuteur(c,a.qui,a.tel)) vu(a.entreprise);
  });
  D.chantiers.forEach(function(x){
    if(catTiersType(x.categorie||"chantier")==="personne") return;
    if(memeInterlocuteur(c,x.contact_nom,x.contact_tel)) vu(x.tiers);
  });
  organisations().forEach(function(o){ if(!res && noms[cleOrg(o.nom)]) res=o });
  return res;
}
function memeInterlocuteur(c,nom,tel){
  var t=telNorm(tel||"");
  if(t.length>=6 && (telNorm(c.tel)===t || telNorm(c.mobile)===t)) return true;
  var n=sansAccent(nom||"").toLowerCase();

}
function civSeule(v){

  var t=sansAccent(v||"").trim().toLowerCase().replace(/[.,]+$/,""),civ="";

var candidatsEnCours=null;
function validerCandidats(creer){
  var l=candidatsEnCours; if(!l) return;
  var bx=$("#modCorps").querySelectorAll("input.cand"),pris={},i,n=0;
  for(i=0;i<bx.length;i++) if(bx[i].checked) pris[bx[i].getAttribute("data-cle")]=1;

      var e=D.parametres.contacts_ecartes||(D.parametres.contacts_ecartes=[]);

    if(mots.length>1){ pre=mots[0]; nom=mots.slice(1).join(" ") }

      premiere_date:x.derniere||"", premiere_lieu:x.lieu||"",
      notes:"Fiche cr\u00e9\u00e9e par d\u00e9tection \u2014 "+x.n+" occurrence(s) dans l\u2019historique.",
      cree_le:new Date().toISOString()
    }));

var grapheNiv=1;
function voisinsDe(id){
  var out=[],vus={};
  reseauDe(id).forEach(function(r){
    var k=(r.org?"o:":"c:")+r.contact.id;
    if(vus[k]) return;

  });

function libNoeud(v){ return v.org ? (v.c.nom||"") : nomComplet(v.c) }
function tronqueLbl(v,n){
  v=String(v||"");
  return v.length>n ? v.slice(0,n-1)+"\u2026" : v;
}
/* graphe egocentre : le contact au centre, ses relations autour. Le type de lien est ecrit
   sur l'arete et le sens porte par la fleche : jamais une information portee par la couleur seule. */
function fragGraphe(id){
  var c=contactPar(id); if(!c) return "";
  var d1=voisinsDe(id);
  if(!d1.length) return '<div class="note-aide" style="margin:0">Aucun lien saisi : le graphe appara\u00eetra d\u00e8s le premier.</div>';
  var LARG=600,HAUT=400,cx=LARG/2,cy=HAUT/2;
  var trop=d1.length>14, montres=trop?d1.slice(0,14):d1;
  var deux=(grapheNiv===2);
  var r1x=deux?145:215, r1y=deux?95:135;
  var noeuds=[],aretes=[],place={};
  place["c:"+id]={x:cx,y:cy};
  var depart=-Math.PI/2;
  montres.forEach(function(v,i){
    var ang=depart+(2*Math.PI*i/montres.length);
    var x=cx+r1x*Math.cos(ang), y=cy+r1y*Math.sin(ang);
    var k1=(v.org?"o:":"c:")+v.c.id;
    place[k1]={x:x,y:y};
    noeuds.push({id:v.c.id,cle:k1,x:x,y:y,lib:libNoeud(v),
      sous:v.org?(v.c.interne?"interne":"organisation"):nomOrg(v.c.org_id),
      estOrg:v.org,niv:1});
    aretes.push({de:"c:"+id,vers:k1,type:v.type,sens:v.sens});
  });
  var n2=0;
  if(deux) montres.forEach(function(v,i){
    if(v.org) return;                                   /* une organisation n'a pas de liens sortants */
    var ang=depart+(2*Math.PI*i/montres.length);
    var sec=voisinsDe(v.c.id).filter(function(w){
      return w.c.id!==id && !place[(w.org?"o:":"c:")+w.c.id];
    });
    sec.slice(0,3).forEach(function(w,j){
      var ec=(j-(Math.min(sec.length,3)-1)/2)*0.30;
      var a2=ang+ec;
      var x=cx+258*Math.cos(a2), y=cy+162*Math.sin(a2);
      var k2=(w.org?"o:":"c:")+w.c.id;
      place[k2]={x:x,y:y}; n2++;
      noeuds.push({id:w.c.id,cle:k2,x:x,y:y,lib:libNoeud(w),
        sous:w.org?(w.c.interne?"interne":"organisation"):nomOrg(w.c.org_id),
        estOrg:w.org,niv:2});
      aretes.push({de:"c:"+v.c.id,vers:k2,type:w.type,sens:w.sens,faible:true});
    });
  });
  function fleche(A,B,rA,rB){
    var dx=B.x-A.x,dy=B.y-A.y,L=Math.sqrt(dx*dx+dy*dy)||1;
    return {x1:A.x+dx/L*rA, y1:A.y+dy/L*rA, x2:B.x-dx/L*rB, y2:B.y-dy/L*rB};
  }
  var svg='<svg viewBox="0 0 '+LARG+' '+HAUT+'" class="grf" role="img" '
    +'aria-label="R\u00e9seau de '+esc(nomComplet(c))+'">'
    +'<defs><marker id="grf-f" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">'
    +'<path d="M0 0 L8 4 L0 8 z" fill="currentColor"/></marker></defs>';
  aretes.forEach(function(e){
    var A=place[e.de],B=place[e.vers];
    if(!A||!B) return;
    var rA=(e.de==="c:"+id?13:8), rB=10;
    var ent=(e.sens==="entrant");
    var g=fleche(ent?B:A, ent?A:B, ent?rB:rA, ent?rA:rB);
    svg+='<line class="grf-a'+(e.faible?" f":"")+'" x1="'+g.x1.toFixed(1)+'" y1="'+g.y1.toFixed(1)
      +'" x2="'+g.x2.toFixed(1)+'" y2="'+g.y2.toFixed(1)+'" marker-end="url(#grf-f)"/>';
    if(e.type && !e.faible){
      var mx=A.x+(B.x-A.x)*0.52, my=A.y+(B.y-A.y)*0.52;
      svg+='<text class="grf-t" x="'+mx.toFixed(1)+'" y="'+my.toFixed(1)+'">'+esc(tronqueLbl(e.type,18))+'</text>';
    }
  });
  svg+='<circle class="grf-n ego" cx="'+cx+'" cy="'+cy+'" r="13"/>'
    +'<text class="grf-l ego" x="'+cx+'" y="'+(cy-22)+'">'+esc(tronqueLbl(nomComplet(c),24))+'</text>';
  noeuds.forEach(function(n){
    /* l'etiquette part vers l'exterieur du cercle : elle ne croise jamais l'arete venue du centre */
    var dy=(n.y<cy-6) ? -16 : 22;
    /* une organisation est un carre, une personne un rond : la forme porte l'information,
       jamais la couleur seule. */
    var forme = n.estOrg
      ? '<rect class="grf-n org'+(n.niv===2?" d2":"")+'" x="'+(n.x-8).toFixed(1)+'" y="'+(n.y-8).toFixed(1)+'" width="16" height="16"/>'
      : '<circle class="grf-n'+(n.niv===2?" d2":"")+'" cx="'+n.x.toFixed(1)+'" cy="'+n.y.toFixed(1)+'" r="8"/>';
    svg+='<g class="grf-g" data-'+(n.estOrg?"org-go":"contact-go")+'="'+esc(n.id)+'">'
      +'<title>'+esc(n.lib+(n.sous?" \u2014 "+n.sous:""))+'</title>'+forme
      +'<text class="grf-l'+(n.niv===2?" d2":"")+'" x="'+n.x.toFixed(1)+'" y="'+(n.y+dy).toFixed(1)+'">'
      +esc(tronqueLbl(n.lib,20))+'</text></g>';
  });
  svg+='</svg>';
  return '<div class="grf-box">'+svg+'</div>'
    +'<div class="ligne" style="margin-top:4px">'
      +'<button class="b mini'+(grapheNiv===1?"":" creux")+'" data-act="grf-1">Relations directes</button>'
      +'<button class="b mini'+(grapheNiv===2?"":" creux")+'" data-act="grf-2">Jusqu\u2019au 2e cercle</button>'
      +'<span class="note-aide" style="margin:0 0 0 auto">'
      +'\u25cf personne \u00b7 \u25a0 organisation \u2014 '
      +montres.length+' direct'+(montres.length>1?"s":"")+(deux?" \u00b7 "+n2+" au 2e cercle":"")
      +(trop?" \u00b7 "+(d1.length-14)+" non repr\u00e9sent\u00e9(s)":"")+'</span>'
    +'</div>';
}

function trouverContact(nom,prenom,tel,mob){
  var ex=null;
  contacts().forEach(function(c){
    if(ex) return;
    var memeTel=(telNorm(tel)&&telNorm(tel)===telNorm(c.tel))||(telNorm(mob)&&telNorm(mob)===telNorm(c.mobile));
    var memeNom=String(c.nom).toLowerCase()===String(nom).toLowerCase()
             && String(c.prenom).toLowerCase()===String(prenom).toLowerCase();
    if(memeTel||memeNom) ex=c;
  });
  return ex;
}
function importerContactsCSV(txt){
  var lignes=lireCSV(String(txt));
  if(lignes.length<2){ toast("Fichier vide ou illisible",true); return }
  var ent=lignes[0].map(function(x){return String(x).trim().toLowerCase()});
  function col(nom){ return ent.indexOf(nom.toLowerCase()) }
  var iNom=col("Nom");
  if(iNom<0){ toast("Colonne « Nom » introuvable",true); return }
  var ajout=0,maj=0,orgN=0;
  for(var i=1;i<lignes.length;i++){
    var lg=lignes[i];
    var val=function(n){ var k=col(n); return k>=0 ? String(lg[k]||"").trim() : "" };
    var nom=val("Nom");
    if(!nom) continue;
    var prenom=val("Prénom"), tel=val("Téléphone"), mob=val("Mobile");
    var ex=trouverContact(nom,prenom,tel,mob);
    var org=val("Organisation"), oid="";

        organisations().push(o); orgN++;
      }
      oid=o.id;
    }
    var niv=val("Nature").toLowerCase(), ncle="inconnu";
    NIVEAUX_REL.forEach(function(n){ if(n[1].toLowerCase()===niv||n[0]===niv) ncle=n[0] });
    var src={nom:nom,prenom:prenom,fonction:val("Fonction"),org_id:oid,
      tel:tel,mobile:mob,mail:val("Courriel"),fiche:val("Fiche interne"),
      relation:val("Relation"),niveau:ncle,
      premiere_date:val("Première rencontre"),premiere_lieu:val("Lieu"),notes:val("Notes")};
    if(ex){
      Object.keys(src).forEach(function(k){ if(src[k]) ex[k]=src[k] });
      maj++;

      src.id=uid(); src.cree_le=new Date().toISOString();
      contacts().push(normaliserContact(src)); ajout++;

      if(!ct || ct.id===src2.id) return;
      var deja=false;
      (src2.liens||[]).forEach(function(l){ if(l.vers===ct.id && l.type===type) deja=true });
      if(deja) return;
      (src2.liens||(src2.liens=[])).push({vers:ct.id,type:type});
      rel++;
    });
  }
  modifie(); rendre();
  toast(ajout+" ajouté(s) · "+maj+" mis à jour"
    +(orgN?" · "+orgN+" organisation(s)":"")+(rel?" · "+rel+" relation(s)":""));

function lireCSV(txt){
  var out=[],l=[],c="",q=false,i;
  txt=txt.replace(/^\uFEFF/,"");
  for(i=0;i<txt.length;i++){
    var k=txt[i];
    if(q){
      if(k==='"'){ if(txt[i+1]==='"'){ c+='"'; i++ } else q=false }
      else c+=k;
    }else{
      if(k==='"') q=true;
      else if(k===";"||k===","){ l.push(c); c="" }
      else if(k==="\n"){ l.push(c); out.push(l); l=[]; c="" }
      else if(k!=="\r") c+=k;
    }
  }
  if(c||l.length){ l.push(c); out.push(l) }
  return out.filter(function(x){ return x.join("").trim() });
}

var rapDeb="", rapFin="", rapTexte=false;
function dansInt(d,a,b){ return !!d && d>=a && d<=b }
function joursOuvresEntre(a,b){
  var n=0,d=pIso(a),f=pIso(b),g=0;
  while(d<=f && g++<800){
    if(!motifNonOuvre(iso(d))) n++;
    d.setDate(d.getDate()+1);
  }
  return n;
}
function moisIso(dec){
  var d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+(dec||0));
  var deb=iso(d);
  d.setMonth(d.getMonth()+1); d.setDate(0);
  return [deb,iso(d)];
}
function compterPar(l,cle){
  var m={},o=[];
  l.forEach(function(x){
    var k=cle(x);
    if(!k) return;
    if(m[k]===undefined){ m[k]=0; o.push(k) }
    m[k]++;
  });
  return o.map(function(k){ return [k,m[k]] }).sort(function(a,b){ return b[1]-a[1] });
}
function ligneRep(l,total){

  }).join("\n");

function rapportPeriode(a,b,avecTexte){
  var t="";
  var acts=D.chantiers.filter(function(c){ return dansInt(c.date,a,b) });
  var notes=(D.notes||[]).filter(function(n){ return dansInt(n.date,a,b) });
  var apps=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature!=="verif" });
  var verifs=(D.appels||[]).filter(function(x){ return dansInt(x.date,a,b) && x.nature==="verif" });
  var dts=(D.dtdict||[]).filter(function(c){ return dansInt(c.date,a,b) });
  var vigs=(D.vigilances||[]).filter(function(v){ return dansInt(v.date,a,b) });

  t+=String(D.parametres.nom_app||NOM_DEFAUT).toUpperCase()+" — RAPPORT D'ACTIVITÉ\n";
  t+="Période du "+libDate(a)+" au "+libDate(b)+"\n";
  t+="Édité le "+libDate(auj())+"\n"+trait("=")+"\n\n";

  var ouvres=joursOuvresEntre(a,b);
  var abs=(D.parametres.absences||[]).filter(function(x){ return dansInt(x,a,b) }).length;
  t+="PLAN DE CHARGE\n";
  t+="- Jours ouvrés sur la période : "+ouvres+"\n";
  if(abs) t+="- Jours d'absence déclarés : "+abs+"\n";
  t+="- Entrées de planning traitées : "+acts.length+"\n";
  var clos=acts.filter(estClos).length;
  t+="- Dont menées à terme : "+clos+(acts.length?"  ("+Math.round(clos*100/acts.length)+" %)":"")+"\n";
  var sansDate=D.chantiers.filter(function(c){ return !c.date && !estClos(c) }).length;
  if(sansDate) t+="- Portefeuille non daté en cours (hors période) : "+sansDate+"\n";

  t+="\nRÉPARTITION PAR NATURE D'ACTIVITÉ\n";
  var parCat=compterPar(acts,function(c){ var K=catParCle(c.categorie||"chantier"); return K?K.lib:"" });
  t+=parCat.length?ligneRep(parCat,acts.length):"  - aucune activité sur la période";

  var parSt=compterPar(acts,function(c){ return libStatut(c.statut) });
  if(parSt.length) t+="\n\nÉTAT D'AVANCEMENT\n"+ligneRep(parSt,acts.length);

  var parType=compterPar(acts,function(c){ return c.type });
  if(parType.length) t+="\n\nTYPES D'INTERVENTION\n"+ligneRep(parType,acts.length);

  t+="\n\nRÉPARTITION DU TEMPS\n";
  var tot=0,lignes=[];
  (D.parametres.rubriques||[]).forEach(function(r){
    var m=0;
    notes.forEach(function(n){ if(n.rubrique_id===r.id) m+=+n.duree||0 });
    if(r.auto==="dtdict") dts.forEach(function(c){ m+=minutesSession(c) });
    if(r.auto==="appels") apps.forEach(function(x){ m+=+x.duree||0 });
    if(m>0){ lignes.push([r.nom,m]); tot+=m }
  });
  var mAct=0;
  acts.forEach(function(c){
    if(!estClos(c)) return;
    var d=+c.duree||0,nn=0;
    notes.forEach(function(n){ if(n.chantier_id===c.id) nn+=+n.duree||0 });
    mAct+=Math.max(d,nn);
  });
  if(mAct>0){ lignes.push(["Temps imputé sur les activités",mAct]); tot+=mAct }
  if(lignes.length){
    lignes.sort(function(x,y){ return y[1]-x[1] });
    t+=lignes.map(function(x){
      return "  - "+x[0]+" : "+dureeLisible(x[1])+(tot?"  ("+Math.round(x[1]*100/tot)+" %)":"");
    }).join("\n")+"\n  Total imputé : "+dureeLisible(tot);
  }else t+="  - aucun temps imputé sur la période";

  if(D.parametres.mod_dtdict!==false && dts.length){
    var tr=0,se=0;
    dts.forEach(function(c){ tr+=+c.traites||0; se+=minutesSession(c) });
    t+="\n\n"+String(D.parametres.titre_dtdict||"Compteur de traitement").toUpperCase()+"\n";
    t+="- Jours de traitement : "+dts.length+"\n- Dossiers traités : "+tr+"\n";
    t+="- Temps chronométré : "+dureeLisible(se)+"\n";
    if(se>0) t+="- Cadence moyenne : "+String(Math.round(tr/(se/60)*10)/10).replace(".",",")+" dossiers/h\n";
  }

  if(D.parametres.mod_permanence!==false && (apps.length||verifs.length)){
    var jrs={},dur=0;
    apps.forEach(function(x){ jrs[x.date]=1; dur+=+x.duree||0 });
    t+="\n\nASSISTANCE TÉLÉPHONIQUE\n";
    t+="- Jours avec appels : "+Object.keys(jrs).length+"\n- Appels traités : "+apps.length+"\n";
    if(dur) t+="- Temps cumulé renseigné : "+dureeLisible(dur)+"\n";
    if(verifs.length) t+="- Vérifications tracées : "+verifs.length+"\n";
    var parMotif=compterPar(apps,function(x){ return x.motif });
    if(parMotif.length) t+="  Motifs :\n"+ligneRep(parMotif,apps.length)+"\n";
  }

  if(vigs.length){
    t+="\n\nPOINTS DE VIGILANCE\n- Déclarés sur la période : "+vigs.length+"\n";
    t+=ligneRep(compterPar(vigs,function(v){ return libNiveauVig(v.niveau) }),vigs.length)+"\n";
    t+="- Levés : "+vigs.filter(function(v){return v.clos}).length+"\n";
  }

  var suites=notes.filter(function(n){ return n.suite });
  if(suites.length){
    t+="\n\nACTIONS DE SUIVI\n- Tâches ouvertes sur la période : "+suites.length+"\n";
    t+="- Dont soldées à ce jour : "+suites.filter(function(n){return n.suite.fait}).length+"\n";
    var ret=suites.filter(function(n){ return !n.suite.fait && n.suite.echeance && n.suite.echeance<auj() }).length;
    if(ret) t+="- Encore ouvertes et échues : "+ret+"\n";
  }

  t+="\n\nJOURNAL\n- Notes consignées : "+notes.length+"\n";
  var parTn=compterPar(notes,function(n){ return n.type });
  if(parTn.length) t+=ligneRep(parTn,notes.length)+"\n";

  var parCom=compterPar(acts,function(c){ return c.commune });
  if(parCom.length){
    t+="\n\nTERRITOIRE COUVERT\n- Communes concernées : "+parCom.length+"\n";
    t+=ligneRep(parCom.slice(0,15),acts.length);
    if(parCom.length>15) t+="\n  - … et "+(parCom.length-15)+" autre(s)";
    t+="\n";
  }
  var orgs={};
  acts.forEach(function(c){ if(c.tiers) orgs[String(c.tiers).toLowerCase()]=1 });
  var no=Object.keys(orgs).length;
  if(no) t+="- Interlocuteurs distincts rencontrés : "+no+"  (non nommés)\n";

  if(avecTexte){
    t+="\n\n"+trait("-")+"\nDÉTAIL EN TEXTE LIBRE — À RELIRE AVANT TOUTE DIFFUSION\n";
    t+="Cette section reprend vos saisies telles quelles : elle peut contenir des\n";
    t+="noms de personnes, d'entreprises ou des références de dossier.\n"+trait("-")+"\n\n";
    var fin=acts.filter(estClos);
    t+="ACTIVITÉS MENÉES À TERME\n";
    t+=fin.length? fin.map(function(c){
        return "- "+libCourt(c.date)+"  "+(c.libelle||"")+(c.commune?" ("+c.commune+")":"");
      }).join("\n") : "  - aucune";
    t+="\n\nNOTES\n";
    t+=notes.length? notes.slice().sort(function(x,y){return (x.date+x.heure).localeCompare(y.date+y.heure)})
        .map(function(n){ return "- "+libCourt(n.date)+"  "+(n.type?"["+n.type+"] ":"")+(n.contenu||"(tâche)") })
        .join("\n") : "  - aucune";
    t+="\n";
  }else{
    t+="\n\nCe rapport ne contient aucune donnée nominative, aucune référence de\ndossier et aucun identifiant de point de livraison.\n";
  }
  return t;
}

function statutAdmis(K,v){

function statutsConnus(cle){

function incoherences(){

    var cle=c.categorie||"chantier";
    if(cache[cle]===undefined) cache[cle]=statutsConnus(cle);
    var m=cache[cle];

/* Un dossier n'a pas toujours de date de planification : les desherences importees n'en ont
